/* ==========================================
   シャッフル
========================================== */

function shuffle(array){

  const copy =
    array.slice();


  for(
    let i =
      copy.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      copy[i],
      copy[j]
    ] = [
      copy[j],
      copy[i]
    ];

  }


  return copy;

}

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function getPlayers(data){

  return Object.entries(
    data.players || {}
  )

  .filter(
    ([id,p]) =>
      p &&
      p.online
  )

  .sort(
    (a,b) =>
      Number(
        a[1].joinedAt || 0
      ) -
      Number(
        b[1].joinedAt || 0
      )
  );

}


/* ==========================================
   次のA
========================================== */

function getNextAUid(
  players,
  currentAUid
){

  if(!players.length){
    return null;
  }


  const currentIndex =
    players.findIndex(
      ([id]) =>
        id === currentAUid
    );


  if(currentIndex < 0){
    return players[0][0];
  }


  return players[
    (
      currentIndex + 1
    ) %
    players.length
  ][0];

}


/* ==========================================
   表示用得点
========================================== */

function getDisplayScore(
  player,
  playerId,
  data
){

  const actualScore =
    Number(
      player?.score || 0
    );


  const rd =
    data.roundData || {};


  if(
    rd.finished ||
    !rd.id
  ){

    return actualScore;

  }


  const roundAnswer =
    data.answers?.[playerId];


  const points =
    roundAnswer &&
    roundAnswer.roundId === rd.id
      ? Number(
          roundAnswer.points || 0
        )
      : 0;


  return Math.max(
    0,
    actualScore - points
  );

}

      `rooms/${id}/players/${user.uid}`
    );


  await set(
    playerRef,
    {

      name:n,

      online:true,

      joinedAt:
        existingPlayer?.joinedAt ||
        Date.now(),

      score:
        Number(
          existingPlayer?.score || 0
        ),

      scoreRounds:
        existingPlayer?.scoreRounds ||
        {}

    }
  );


  onDisconnect(
    playerRef
  )
  .update({
    online:false
  });


  $("roomCode")
    .textContent = id;


  show("room");


  if(unsub){
    unsub();
  }


  unsub =
    onValue(
      ref(
        db,
        `rooms/${id}`
      ),
      snapshot => {

        sync(
          snapshot.val() || {}
        );

      }
    );

}


/* ==========================================
   得点確定
========================================== */

async function applyRoundScores(
  data,
  rd
){

  if(
    !rd.id ||
    rd.finished ||
    rd.skipped ||
    rd.scoresApplied
  ){
    return;
  }


  if(
    settlingRoundId === rd.id
  ){
    return;
  }


  settlingRoundId =
    rd.id;


  try{

    const answers =
      data.answers || {};


    const currentAnswers =
      Object.entries(
        answers
      )
      .filter(
        ([playerId,value]) =>
          value &&
          value.roundId === rd.id &&
          playerId !== rd.aUid
      );


    for(
      const [playerId,value]
      of currentAnswers
    ){

      const points =
        Number(
          value.points || 0
        );


      const playerRef =
        ref(
          db,
          `rooms/${roomId}/players/${playerId}`
        );


      await runTransaction(
        playerRef,
        currentPlayer => {

          if(!currentPlayer){
            return currentPlayer;
          }


          const scoreRounds =
            currentPlayer.scoreRounds ||
            {};


          const roundKey =
            String(
              rd.id
            );


          if(
            Object.prototype.hasOwnProperty.call(
              scoreRounds,
              roundKey
            )
          ){
            return currentPlayer;
          }


          return {

            ...currentPlayer,

            score:
              Number(
                currentPlayer.score || 0
              ) +
              points,

            scoreRounds:{
              ...scoreRounds,
              [roundKey]:points
            }

          };

        }
      );

    }


    await update(
      ref(
        db,
        `rooms/${roomId}/roundData`
      ),
      {

        scoresApplied:true,
        finished:true,
        finishedAt:Date.now()

      }
    );


  }catch(error){

    console.error(
      "得点処理エラー:",
      error
    );

  }finally{

    settlingRoundId = null;

  }

}


/* ==========================================
   同期
========================================== */

async function sync(data){

  if(!user){
    return;
  }


  const players =
    getPlayers(data);


  const rd =
    data.roundData || {};


  $("players").textContent =
    "参加者：" +
    (
      players.length
        ? players
            .map(
              ([id,p]) =>
                `${p.name} (${getDisplayScore(p,id,data)}点)`
            )
            .join("、")
        : "なし"
    );


  const myPlayer =
    data.players?.[user.uid];


  $("myScore").textContent =
    getDisplayScore(
      myPlayer,
      user.uid,
      data
    );


  round =
    rd.id || 0;


  /* ======================================
     開始前
  ====================================== */

  if(!round){

    stopTimer();

    $("promptCard")
      .classList
      .add("hidden");

    $("answerCard")
      .classList
      .add("hidden");

    $("resultCard")
      .classList
      .add("hidden");

    $("skipRound")
      .classList
      .add("hidden");


    $("roleTitle")
      .textContent =
        "ゲーム開始待ち";


    $("roomMessage")
      .textContent =
        players.length < 2
          ? "2人以上参加するとゲームを開始できます。"
          : "ゲーム作成者が「次のお題を開始」を押してください。";


    $("hostControls")
      .classList
      .toggle(
        "hidden",
        data.hostUid !== user.uid
      );


    return;

  }


  const isA =
    rd.aUid === user.uid;


  /* ======================================
     ラウンド変更
  ====================================== */

  if(
    currentAnswerRound !== rd.id
  ){

    answerSubmittedRound = null;

  }


  /* ======================================
     終了
  ====================================== */

  if(rd.finished){

    stopTimer();


    $("promptCard")
      .classList
      .add("hidden");


    $("answerCard")
      .classList
      .add("hidden");


    $("skipRound")
      .classList
      .add("hidden");


    $("resultCard")
      .classList
      .remove("hidden");


    /*
      スキップ
    */

    if(rd.skipped){

      renderSkippedResult(
        data
      );

    }else{

      renderResults(
        data
      );

    }


    /*
      次のラウンドを開始する人。

      通常終了：
      今回のA

      スキップ：
      次のA
    */

    const nextStarterUid =
      rd.skipped
        ? getNextAUid(
            players,
            rd.aUid
          )
        : rd.aUid;


    $("hostControls")
      .classList
      .toggle(
        "hidden",
        user.uid !== nextStarterUid
      );


    if(rd.skipped){

      if(
        user.uid === nextStarterUid
      ){

        $("roleTitle")
          .textContent =
            "🎭 次はあなたがAです";


        $("roomMessage")
          .textContent =
            "「次のお題を開始」を押してください。";

      }else{

        $("roleTitle")
          .textContent =
            "ラウンド終了";


        $("roomMessage")
          .textContent =
            "Aがお題をスキップしました。次のAが開始するのを待っています。";

      }

    }else{

      $("roleTitle")
        .textContent =
          "ラウンド終了";


      $("roomMessage")
        .textContent =
          isA
            ? "全員の回答が完了しました。「次のお題を開始」を押してください。"
            : "全員の回答が完了しました。次のお題を待っています。";

    }


    return;

  }


  /* ======================================
     進行中
  ====================================== */

  $("resultCard")
    .classList
    .add("hidden");


  $("hostControls")
    .classList
    .add("hidden");


  /* ======================================
     A
  ====================================== */

  if(isA){

    stopTimer();


    $("roleTitle")
      .textContent =
        "🎭 あなたはA（演じる人）";


    $("promptCard")
      .classList
      .remove("hidden");


    $("answerCard")
      .classList
      .add("hidden");


    $("line")
      .textContent =
        rd.line || "";


    $("expr")
      .textContent =
        rd.expr || "";


    if(rd.performed){

      performedLocked = true;


      $("performed")
        .disabled = true;


      $("performed")
        .classList
        .add("done");


      $("performed")
        .textContent =
          "表現済み";


      /*
        表現後はスキップ不可。
      */

      $("skipRound")
        .classList
        .add("hidden");


      $("roomMessage")
        .textContent =
          "全員の回答を待っています。";

    }else{

      performedLocked = false;


      $("performed")
        .disabled = false;


      $("performed")
        .classList
        .remove("done");


      $("performed")
        .textContent =
          "表現した！";


      $("skipRound")
        .classList
        .remove("hidden");


      $("skipRound")
        .disabled = false;


      $("roomMessage")
        .textContent =
          "お題を確認して表現してください。";

    }

  }


  /* ======================================
     B
  ====================================== */

  else{

    $("roleTitle")
      .textContent =
        "🎯 あなたはB（答える人）";


    $("promptCard")
      .classList
      .add("hidden");


    $("skipRound")
      .classList
      .add("hidden");


    const myAnswer =
      data.answers?.[user.uid];


    const alreadyAnswered =
      myAnswer &&
      myAnswer.roundId === rd.id;


    if(alreadyAnswered){

      answerSubmittedRound =
        rd.id;


      stopTimer();


      $("answerCard")
        .classList
        .add("hidden");


      $("roomMessage")
        .textContent =
          "回答を受け付けました。全員の回答を待っています。";

    }


    else if(
      answerSubmittedRound === rd.id
    ){

      stopTimer();


      $("answerCard")
        .classList
        .add("hidden");


      $("roomMessage")
        .textContent =
          "回答を受け付けました。全員の回答を待っています。";

    }


    else if(rd.performed){

      makeChoices(
        rd.expr,
        rd.performedAt,
        rd.id
      );


      $("answerCard")
        .classList
        .remove("hidden");


      $("roomMessage")
        .textContent =
          "Aの表現を見て回答してください。";

    }


    else{

      stopTimer();


      $("answerCard")
        .classList
        .add("hidden");


      $("roomMessage")
        .textContent =
          "Aが表現するのを待っています。";

    }

  }


  /* ======================================
     全員回答チェック
  ====================================== */

  if(
    isA &&
    rd.performed &&
    !rd.finished &&
    !rd.skipped &&
    !rd.scoresApplied &&
    settlingRoundId !== rd.id
  ){

    const answerPlayers =
      players.filter(
        ([id]) =>
          id !== rd.aUid
      );


    const answeredCount =
      answerPlayers.filter(
        ([id]) =>
          data.answers?.[id]?.roundId === rd.id
      ).length;


    if(
      answerPlayers.length > 0 &&
      answeredCount ===
      answerPlayers.length
    ){

      await applyRoundScores(
        data,
        rd
      );

    }

  }

}


/* ==========================================
   選択肢
========================================== */

function makeChoices(
  correct,
  performedAt,
  roundId
){

  if(
    answerSubmittedRound === roundId
  ){
    return;
  }


  if(
    currentAnswerRound === roundId
  ){

    startTimer(
      performedAt
    );

    return;

  }


  currentAnswerRound =
    roundId;


  answer = "";


  $("sendAnswer")
    .disabled = true;


  $("choices")
    .innerHTML = "";


  const wrongAnswers =
    shuffle(
      exprs.filter(
        x =>
          x !== correct
      )
    )
    .slice(
      0,
      7
    );


  const choices =
    shuffle([
      correct,
      ...wrongAnswers
    ]);


  choices.forEach(x => {

    const button =
      document.createElement(
        "button"
      );


    button.className =
      "choice";


    button.textContent =
      x;


    button.onclick = () => {

      if(
        answerSubmittedRound === roundId
      ){
        return;
      }


      document
        .querySelectorAll(
          "#choices .choice"
        )
        .forEach(
          element =>
            element
              .classList
              .remove("selected")
        );


      button
        .classList
        .add("selected");


      answer = x;


      $("sendAnswer")
        .disabled = false;

    };


    $("choices")
      .appendChild(
        button
      );

  });


  startTimer(
    performedAt
  );

}


/* ==========================================
   タイマー
========================================== */

function startTimer(
  startedAt
){

  if(!startedAt){
    return;
  }


  stopTimer();


  function updateTimer(){

    const elapsed =
      Math.max(
        0,
        (
          Date.now() -
          startedAt
        ) / 1000
      );


    $("timer")
      .textContent =
        elapsed.toFixed(1) +
        "秒";

  }


  updateTimer();


  timerInterval =
    setInterval(
      updateTimer,
      100
    );

}


function stopTimer(){

  if(timerInterval){

    clearInterval(
      timerInterval
    );

    timerInterval = null;

  }

}


/* ==========================================
   得点
========================================== */

function calculateScore(
  isCorrect,
  elapsed
){

  if(!isCorrect){
    return 0;
  }


  if(elapsed <= 5){
    return 150;
  }


  if(elapsed <= 10){
    return 130;
  }


  if(elapsed <= 20){
    return 110;
  }


  return 100;

}


/* ==========================================
   ランキングHTML
========================================== */

function makeRanking(
  data
){

  return Object.entries(
    data.players || {}
  )

  .filter(
    ([id,player]) =>
      player
  )

  .sort(
    (a,b) =>
      Number(
        b[1].score || 0
      ) -
      Number(
        a[1].score || 0
      )
  )

  .map(
    ([id,player],index) => `

      <div class="rank">

        <span>
          ${index + 1}位　
          ${escapeHtml(player.name)}
        </span>

        <strong>
          ${Number(player.score || 0)}点
        </strong>

      </div>

    `
  )

  .join("");

}


/* ==========================================
   通常結果
========================================== */

function renderResults(data){

  const rd =
    data.roundData || {};


  const answers =
    data.answers || {};


  const currentAnswers =
    Object.entries(
      answers
    )
    .filter(
      ([id,value]) =>
        value &&
        value.roundId === rd.id
    );


  const answerRows =
    currentAnswers
      .map(
        ([id,value]) => {

          const player =
            data.players?.[id];


          if(!player){
            return "";
          }


          const isCorrect =
            value.answer === rd.expr;


          const points =
            Number(
              value.points || 0
            );


          const elapsed =
            Number(
              value.elapsed || 0
            );


          return `

            <div class="result-answer">

              <div
                style="
                  display:flex;
                  justify-content:space-between;
                  gap:8px;
                "
              >

                <strong>
                  ${escapeHtml(player.name)}
                </strong>

                <strong>
                  ${
                    isCorrect
                      ? "⭕ 正解"
                      : "❌ 不正解"
                  }
                </strong>

              </div>


              <div
                class="${
                  isCorrect
                    ? "correct"
                    : "wrong"
                }"
                style="margin-top:6px"
              >

                回答：
                ${escapeHtml(
                  value.answer ||
                  "回答なし"
                )}

              </div>


              ${
                isCorrect
                  ? `
                    <div
                      class="muted"
                      style="margin-top:5px"
                    >
                      回答時間：
                      ${elapsed.toFixed(1)}秒
                    </div>
                  `
                  : ""
              }


              <div
                style="margin-top:5px"
              >
                獲得：
                <strong>
                  ${points}点
                </strong>
              </div>

            </div>

          `;

        }
      )
      .filter(Boolean)
      .join("");


  const ranking =
    makeRanking(
      data
    );


  $("result").innerHTML = `

    <div class="card">

      <div class="muted">
        今回のお題
      </div>

      <div
        style="
          font-size:20px;
          font-weight:700;
          margin:8px 0 20px;
        "
      >
        「${escapeHtml(rd.line || "")}」
      </div>


      <div class="muted">
        正解
      </div>


      <div class="big">
        「${escapeHtml(rd.expr || "")}」
      </div>


      ${
        answerRows ||
        `
          <p class="muted">
            回答はありませんでした。
          </p>
        `
      }

    </div>


    <div class="card">

      <h2>
        🏆 現在の順位
      </h2>

      ${
        ranking ||
        `
          <p class="muted">
            参加者がいません。
          </p>
        `
      }

    </div>

  `;

}

      ref(

$("startRound").onclick =

      await get(
        ref(
          db,
          `rooms/${roomId}`
        )
      );

      snapshot.val() || {};

      getPlayers(
        data
      );


    if(
      players.length < 2
    ){

      alert(
        "2人以上参加してから開始してください。"
      );

      return;

    }


    const rd =
      data.roundData || {};


    const currentRoundId =
      rd.id || 0;


    let newAUid = null;


    /*
      最初のラウンド
    */

    if(!currentRoundId){

      if(
        data.hostUid !== user.uid
      ){

        alert(
          "ゲーム作成者だけが最初のお題を開始できます。"
        );

        return;

      }


      newAUid =
        players[0][0];

    }

      2ラウンド目以降
    */

    else{

      if(!rd.finished){

        alert(
          "現在のラウンドがまだ終了していません。"
        );

        return;

      }


      const nextAUid =
        getNextAUid(
          players,
          rd.aUid
        );


      /*
        スキップ時は次のA本人が開始。

        通常終了時は前回Aが
        次のお題を開始。
      */

        rd.skipped
          ? nextAUid
          : rd.aUid;

        user.uid !==
        allowedStarterUid
      ){

          rd.skipped
            ? "次の表現者が次のお題を開始できます。"
            : "前のラウンドの表現者が次のお題を開始できます。"
        );

        return;

      }


      /*
        新しいAは必ず前回Aの次。
      */

      newAUid =
        nextAUid;

    }


    if(!newAUid){

      throw new Error(
        "次の表現者を決定できませんでした。"
      );

    }


    const nextRoundNumber =
      Number(
        rd.roundNumber || 0
      ) + 1;

      lines[
        Math.floor(
          Math.random() *
          lines.length
        )
      ];

      exprs[
        Math.floor(
          Math.random() *
          exprs.length
        )
      ];

      Date.now();

      ref(
        db,
        `rooms/${roomId}`
      ),

            roundId,

            newAUid,

          expr:

          performed:
            false,

          performedAt:
            0,

          finished:
            false,

          scoresApplied:
            false,

          skipped:
            false,

          startedAt:
            Date.now()

        },

        answers:{}

      }
    );


    performedLocked =
      false;

    currentAnswerRound =
      null;

    answerSubmittedRound =
      null;

    answer =
      "";

    settlingRoundId =
      null;


    $("performed")
      .disabled =
      false;


    $("performed")
      .classList
      .remove("done");


    $("performed")
      .textContent =
        "表現した！";

      .disabled =
      false;

      .disabled =
      true;


    $("resultCard")
      .classList
      .add("hidden");


    $("hostControls")
      .classList
      .add("hidden");


  }catch(error){

    console.error(
      error
    );


    alert(
      "お題を開始できませんでした。\n\n" +
      error.message
    );

  }finally{

    $("startRound").disabled =
      false;

  }

};

$("performed").onclick =
async () => {

  try{

    if(performedLocked){
      return;
    }


    performedLocked =
      true;


    $("performed")
      .disabled =
      true;


    const snapshot =
      await get(
        ref(
          db,
          `rooms/${roomId}/roundData`
        )
      );


    const rd =
      snapshot.val() || {};


    if(
      rd.aUid !== user.uid
    ){

      throw new Error(
        "現在の表現者ではありません。"
      );

    }


    if(
      rd.finished ||
      rd.skipped
    ){

      return;

    }


    if(rd.performed){

      return;

    }


    await update(
      ref(
        db,
        `rooms/${roomId}/roundData`
      ),
      {

        performed:true,
        performedAt:Date.now()

      }
    );


    $("performed")
      .classList
      .add("done");


    $("performed")
      .textContent =
        "表現済み";


  }catch(error){

    console.error(
      error
    );


    performedLocked =
      false;


    $("performed")
      .disabled =
      false;


    $("performed")
      .classList
      .remove("done");


    $("performed")
      .textContent =
        "表現した！";


    alert(
      "処理に失敗しました。\n\n" +
      error.message
    );

  }

};


/* ==========================================
   A：スキップ
========================================== */

$("skipRound").onclick =
async () => {

  try{

    const confirmed =
      confirm(
        "このAをスキップして、次のプレイヤーに交代しますか？"
      );


    if(!confirmed){
      return;
    }


    $("skipRound")
      .disabled =
      true;


    const snapshot =
      await get(
        ref(
          db,
          `rooms/${roomId}/roundData`
        )
      );


    const rd =
      snapshot.val() || {};


    if(
      rd.aUid !== user.uid
    ){

      throw new Error(
        "現在の表現者ではありません。"
      );

    }


    if(
      rd.finished ||
      rd.skipped
    ){
      return;
    }


    /*
      表現した後はスキップ不可。
    */

    if(rd.performed){

      alert(
        "「表現した！」を押した後はスキップできません。"
      );

      return;

    }


    await update(
      ref(
        db,
        `rooms/${roomId}/roundData`
      ),
      {

        skipped:true,
        finished:true,
        scoresApplied:true,
        skippedAt:Date.now()

      }
    );


    performedLocked =
      true;


    stopTimer();


  }catch(error){

    console.error(
      "スキップ処理エラー:",
      error
    );


    alert(
      "Aをスキップできませんでした。\n\n" +
      error.message
    );

  }finally{

    $("skipRound")
      .disabled =
      false;

  }

};


/* ==========================================
   B：回答
========================================== */

$("sendAnswer").onclick =
async () => {

  try{

    if(!answer){
      return;
    }


    $("sendAnswer")
      .disabled =
      true;


    const snapshot =
      await get(
        ref(
          db,
          `rooms/${roomId}`
        )
      );


    const data =
      snapshot.val() || {};


    const rd =
      data.roundData || {};


    if(
      rd.finished ||
      rd.skipped
    ){
      return;
    }


    if(
      rd.aUid === user.uid
    ){
      return;
    }


    if(!rd.performed){

      $("sendAnswer")
        .disabled =
        false;

      return;

    }


    const existingAnswer =
      data.answers?.[user.uid];


    if(
      existingAnswer &&
      existingAnswer.roundId === rd.id
    ){

      answerSubmittedRound =
        rd.id;


      stopTimer();


      $("answerCard")
        .classList
        .add("hidden");


      return;

    }


    const elapsed =
      rd.performedAt
        ? Math.max(
            0,
            (
              Date.now() -
              rd.performedAt
            ) / 1000
          )
        : 999;


    const correct =
      answer === rd.expr;


    const points =
      calculateScore(
        correct,
        elapsed
      );


    await set(
      ref(
        db,
        `rooms/${roomId}/answers/${user.uid}`
      ),
      {

        roundId:
          rd.id,

        answer:
          answer,

        correct:
          correct,

        elapsed:
          elapsed,

        points:
          points,

        answeredAt:
          Date.now()

      }
    );


    answerSubmittedRound =
      rd.id;


    stopTimer();


    $("answerCard")
      .classList
      .add("hidden");


    $("roomMessage")
      .textContent =
        "回答を受け付けました。全員の回答を待っています。";


    answer = "";


  }catch(error){

    console.error(
      error
    );


    $("sendAnswer")
      .disabled =
      false;


    alert(
      "回答を送信できませんでした。\n\n" +
      error.message
    );

  }

};
