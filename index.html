<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>表現当てゲーム</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  background:#f4f4f5;
  color:#222
}
main{
  max-width:680px;
  margin:auto;
  padding:16px
}
.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin:12px 0;
  box-shadow:0 2px 12px #0001
}
h1,h2{margin:0 0 12px}
.muted{color:#777;font-size:14px}
.big{
  font-size:32px;
  font-weight:800;
  text-align:center;
  line-height:1.4;
  margin:22px 0
}
button,input{font:inherit}
button{
  min-height:46px;
  border:0;
  border-radius:12px;
  padding:10px 15px;
  font-weight:700
}
.primary{
  background:#222;
  color:#fff;
  width:100%
}
.secondary{background:#eee}
.danger{
  background:#f3dddd;
  color:#a00
}
input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px
}
.row{
  display:flex;
  gap:8px
}
.row>*{min-width:0}
.row input{flex:1}
.hidden{display:none!important}
.choice{
  width:100%;
  text-align:left;
  background:#f1f1f1;
  margin:5px 0
}
.choice.selected{
  outline:3px solid #555
}
.list{
  padding:9px 0;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  gap:8px
}
.badge{
  display:inline-block;
  background:#eee;
  border-radius:99px;
  padding:5px 9px;
  font-size:12px
}
.center{text-align:center}

.score{
  font-size:24px;
  font-weight:800;
  margin:10px 0
}

.rank{
  padding:10px 0;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between
}

.timer{
  font-size:18px;
  font-weight:700;
  text-align:center;
  margin:10px 0
}
</style>
</head>

<body>
<main>

<div class="card">
  <h1>🎭 表現当てゲーム</h1>
  <p class="muted">
    Aがセリフを指定された表現で演じ、A以外の全員が「どんな表現だったか」を当てます。
    Aはラウンドごとに順番に交代します。
  </p>
</div>

<section id="home">

<div class="card">
  <h2>ゲームを作る</h2>
  <input id="hostName" placeholder="あなたの名前">
  <button id="create" class="primary" style="margin-top:10px">
    ルームを作成
  </button>
</div>

<div class="card">
  <h2>ゲームに参加</h2>
  <input id="roomInput" placeholder="4桁の参加コード">
  <input id="joinName" placeholder="名前" style="margin-top:8px">
  <button id="join" class="primary" style="margin-top:10px">
    参加する
  </button>
</div>

<div class="card">
  <button id="editorOpen" class="secondary" style="width:100%">
    セリフ・表現を編集
  </button>
</div>

</section>

<section id="room" class="hidden">

<div class="card center">
  <span class="badge">参加コード</span>
  <div class="big" id="roomCode"></div>

  <p id="players"></p>

  <div class="score">
    あなたの得点：<span id="myScore">0</span>点
  </div>
</div>

<div class="card" id="hostControls">
  <button id="startRound" class="primary">
    次のお題を開始
  </button>
</div>

<div class="card">
  <h2 id="roleTitle"></h2>
  <div id="roomMessage" class="muted"></div>
</div>

<div class="card hidden" id="promptCard">
  <span class="badge">Aだけ見る</span>

  <div class="big">
    「<span id="line"></span>」を<br>
    「<span id="expr"></span>」で表現！
  </div>

  <button id="performed" class="primary">
    表現した！
  </button>
</div>

<div class="card hidden" id="answerCard">

  <h2>回答</h2>

  <p class="muted">
    Aはどんな表現をしていましたか？
  </p>

  <div id="timer" class="timer">
    0.0秒
  </div>

  <div id="choices"></div>

  <button id="sendAnswer" class="primary" disabled>
    回答する
  </button>

</div>

<div class="card hidden" id="resultCard">

  <h2>結果</h2>

  <div id="result"></div>

</div>

</section>

<section id="editor" class="hidden">

<div class="card">
  <h2>セリフ</h2>

  <div class="row">
    <input id="newLine" placeholder="例：好き">
    <button id="addLine">追加</button>
  </div>

  <div id="lineList"></div>
</div>

<div class="card">
  <h2>表現</h2>

  <div class="row">
    <input id="newExpr" placeholder="例：照れて">
    <button id="addExpr">追加</button>
  </div>

  <div id="exprList"></div>
</div>

<div class="card">
  <button id="editorBack" class="secondary" style="width:100%">
    戻る
  </button>
</div>

</section>

</main>

<script type="module">

/* -------------------------
   保存データ
------------------------- */

let savedLines =
  JSON.parse(localStorage.getItem("lines") || "null");

let savedExprs =
  JSON.parse(localStorage.getItem("exprs") || "null");


let lines = savedLines
  ? [...savedLines, ...defaultLines.filter(x => !savedLines.includes(x))]
  : [...defaultLines];

let exprs = savedExprs
  ? [...savedExprs, ...defaultExpr.filter(x => !savedExprs.includes(x))]
  : [...defaultExpr];


localStorage.setItem("lines", JSON.stringify(lines));
localStorage.setItem("exprs", JSON.stringify(exprs));


/* -------------------------
   ゲーム変数
------------------------- */

let db;
let app;
let auth;

let user;
let roomId;
let name;

let answer = "";
let round = 0;

let unsub;

let answerStartedAt = 0;

let timerInterval;


/* -------------------------
   Firebase初期化
   ※二重初期化を防止
------------------------- */

async function init(){

  if(firebaseConfig.apiKey.startsWith("YOUR_")){

    alert(
      "Firebase設定が未入力です。READMEの手順で設定してください。"
    );

    return;
  }


  if(!app){

    app = initializeApp(firebaseConfig);

    db = getDatabase(app);

    auth = getAuth(app);

    await signInAnonymously(auth);

    user = auth.currentUser;

  }else{

    if(!user){
      user = auth.currentUser;
    }

  }
}


/* -------------------------
   画面切り替え
------------------------- */

function show(id){

  ["home","room","editor"].forEach(x =>
    $(x).classList.add("hidden")
  );

  $(id).classList.remove("hidden");
}


/* -------------------------
   ルームコード
------------------------- */

function code(){

  return Math.floor(
    1000 + Math.random() * 9000
  ).toString();

}


/* -------------------------
   シャッフル
------------------------- */

function shuffle(a){

  return a
    .slice()
    .sort(() => Math.random() - 0.5);

}


/* -------------------------
   編集画面
------------------------- */

function renderEditor(){

  $("lineList").innerHTML =
    lines.map((x,i) => `
      <div class="list">
        <span>${x}</span>
        <button class="danger" onclick="delLine(${i})">
          削除
        </button>
      </div>
    `).join("");


  $("exprList").innerHTML =
    exprs.map((x,i) => `
      <div class="list">
        <span>${x}</span>
        <button class="danger" onclick="delExpr(${i})">
          削除
        </button>
      </div>
    `).join("");

}


window.delLine = i => {

  if(lines.length > 1){

    lines.splice(i,1);

    localStorage.setItem(
      "lines",
      JSON.stringify(lines)
    );

    renderEditor();

  }

};


window.delExpr = i => {

  if(exprs.length > 1){

    exprs.splice(i,1);

    localStorage.setItem(
      "exprs",
      JSON.stringify(exprs)
    );

    renderEditor();

  }

};


$("editorOpen").onclick = () => {

  renderEditor();

  show("editor");

};


$("editorBack").onclick = () => {

  show("home");

};


$("addLine").onclick = () => {

  const v =
    $("newLine").value.trim();

  if(v){

    lines.push(v);

    localStorage.setItem(
      "lines",
      JSON.stringify(lines)
    );

    $("newLine").value = "";

    renderEditor();

  }

};


$("addExpr").onclick = () => {

  const v =
    $("newExpr").value.trim();

  if(v){

    exprs.push(v);

    localStorage.setItem(
      "exprs",
      JSON.stringify(exprs)
    );

    $("newExpr").value = "";

    renderEditor();

  }

};


/* -------------------------
   ルームへ入る
------------------------- */

async function enter(id,n,isHost){

  await init();

  roomId = id;
  name = n;


  const playerRef =
    ref(
      db,
      `rooms/${id}/players/${user.uid}`
    );


  /*
    joinedAtで参加順を管理
  */

  await set(playerRef,{
    name:n,
    online:true,
    joinedAt:Date.now(),
    score:0
  });


  onDisconnect(playerRef)
    .update({online:false});


  $("roomCode").textContent = id;

  show("room");


  /*
    ホストだけ「次のお題」を操作できる
  */

  if(isHost){

    $("hostControls")
      .classList
      .remove("hidden");

  }else{

    $("hostControls")
      .classList
      .add("hidden");

  }


  unsub?.();


  unsub =
    onValue(
      ref(db,`rooms/${id}`),
      snap => sync(snap.val() || {})
    );

}


/* -------------------------
   Aを決定
------------------------- */

function getPlayers(data){

  return Object.entries(
    data.players || {}
  )
  .filter(([id,p]) => p.online)
  .sort((a,b) =>
    (a[1].joinedAt || 0) -
    (b[1].joinedAt || 0)
  );

}


function getCurrentA(data){

  const players =
    getPlayers(data);

  if(!players.length){
    return null;
  }


  const index =
    (round - 1) % players.length;


  return players[index]?.[0] || null;

}


/* -------------------------
   ゲーム同期
------------------------- */

function sync(data){

  const players =
    getPlayers(data);


  $("players").textContent =
    "参加者：" +
    players
      .map(([id,p]) => p.name)
      .join("、");


  const myPlayer =
    data.players?.[user?.uid];


  $("myScore").textContent =
    myPlayer?.score || 0;


  const rd =
    data.roundData || {};


  round =
    rd.id || 0;


  /*
    ラウンドがまだ始まっていない
  */

  if(!round){

    $("promptCard")
      .classList
      .add("hidden");

    $("answerCard")
      .classList
      .add("hidden");

    $("resultCard")
      .classList
      .add("hidden");


    $("roleTitle").textContent =
      "次のゲームを待っています";


    $("roomMessage").textContent =
      "ホストが「次のお題を開始」を押してください。";


    return;
  }


  /*
    今回のA
  */

  const currentA =
    rd.aUid;


  const isA =
    currentA === user.uid;


  /*
    自分の役割を表示
  */

  $("roleTitle").textContent =
    isA
      ? "🎭 あなたはA（演じる人）"
      : "🎯 あなたは回答者";


  /*
    Aの場合
  */

  if(isA){

    $("promptCard")
      .classList
      .remove("hidden");

    $("answerCard")
      .classList
      .add("hidden");

    $("line").textContent =
      rd.line;

    $("expr").textContent =
      rd.expr;


    if(!rd.performed){

      $("roomMessage").textContent =
        "お題を確認して表現してください。";

    }else{

      $("roomMessage").textContent =
        "全員の回答を待っています。";

    }

  }


  /*
    A以外の場合
  */

  if(!isA){

    $("promptCard")
      .classList
      .add("hidden");


    if(
      rd.performed &&
      !rd.finished
    ){

      makeChoices(rd.expr,rd.performedAt);


      $("answerCard")
        .classList
        .remove("hidden");


      $("roomMessage").textContent =
        "Aの表現を見て回答してください。";

    }else{

      $("answerCard")
        .classList
        .add("hidden");


      $("roomMessage").textContent =
        "Aが表現するのを待っています。";

    }

  }


  /*
    全員の回答が完了したか確認
  */

  if(
    isA &&
    rd.performed &&
    !rd.finished
  ){

    const answerCount =
      Object.keys(
        data.answers || {}
      ).length;


    const answerPlayers =
      players.filter(
        ([id]) => id !== currentA
      );


    if(
      answerPlayers.length > 0 &&
      answerCount >= answerPlayers.length
    ){

      update(
        ref(
          db,
          `rooms/${roomId}/roundData`
        ),
        {
          finished:true
        }
      );

    }

  }


  /*
    ラウンド終了
  */

  if(rd.finished){

    $("promptCard")
      .classList
      .add("hidden");

    $("answerCard")
      .classList
      .add("hidden");

    $("resultCard")
      .classList
      .remove("hidden");

    stopTimer();

    renderResults(data);

  }

}


/* -------------------------
   回答選択肢
------------------------- */

function makeChoices(correct,performedAt){

  if(
    $("choices").dataset.round == round
  ){
    startTimer(performedAt);
    return;
  }


  $("choices").dataset.round =
    round;

  answer = "";

  $("sendAnswer").disabled =
    true;

  $("choices").innerHTML = "";


  const wrongAnswers =
    shuffle(
      exprs.filter(
        x => x !== correct
      )
    ).slice(0,7);


  const choices =
    shuffle([
      correct,
      ...wrongAnswers
    ]);


  choices.forEach(x => {

    const b =
      document.createElement("button");


    b.className =
      "choice";


    b.textContent =
      x;


    b.onclick = () => {

      document
        .querySelectorAll(".choice")
        .forEach(q =>
          q.classList.remove("selected")
        );


      b.classList.add("selected");


      answer = x;


      $("sendAnswer").disabled =
        false;

    };


    $("choices")
      .appendChild(b);

  });


  startTimer(performedAt);

}


/* -------------------------
   タイマー
------------------------- */

function startTimer(startedAt){

  if(!startedAt){
    return;
  }


  stopTimer();


  function updateTimer(){

    const seconds =
      (Date.now() - startedAt) / 1000;


    $("timer").textContent =
      seconds.toFixed(1) + "秒";

  }


  updateTimer();


  timerInterval =
    setInterval(
      updateTimer,
      100
    );

}


function stopTimer(){

  if(timerInterval){

    clearInterval(timerInterval);

    timerInterval = null;

  }

}


/* -------------------------
   得点計算
------------------------- */

function calculateScore(isCorrect,elapsed){

  if(!isCorrect){
    return 0;
  }


  if(elapsed <= 5){
    return 150;
  }


  if(elapsed <= 10){
    return 130;
  }


  if(elapsed <= 20){
    return 110;
  }


  return 100;

}


/* -------------------------
   結果表示
------------------------- */

function renderResults(data){

  const rd =
    data.roundData || {};


  const answers =
    data.answers || {};


  const rows =
    Object.entries(answers)
      .map(([id,v]) => {

        const p =
          data.players?.[id];


        if(!p){
          return "";
        }


        const correct =
          v.answer === rd.expr;


        const points =
          v.points || 0;


        const elapsed =
          v.elapsed || 0;


        return `
          <div class="rank">
            <span>
              ${p.name}
              ${correct ? "✅" : "❌"}
            </span>

            <span>
              ${correct ? elapsed.toFixed(1) + "秒 / " : ""}
              +${points}点
            </span>
          </div>
        `;

      })
      .filter(Boolean)
      .join("");


  /*
    現在の累計スコア順
  */

  const ranking =
    Object.entries(
      data.players || {}
    )
    .sort(
      (a,b) =>
        (b[1].score || 0) -
        (a[1].score || 0)
    )
    .map(([id,p],index) => {

      return `
        <div class="rank">
          <span>
            ${index + 1}位　${p.name}
          </span>

          <strong>
            ${p.score || 0}点
          </strong>
        </div>
      `;

    })
    .join("");


  $("result").innerHTML = `

    <div class="card">

      <div class="muted">
        今回の正解
      </div>

      <div class="big">
        「${rd.expr}」
      </div>

      ${rows || "<p>回答なし</p>"}

    </div>


    <div class="card">

      <h2>🏆 現在の順位</h2>

      ${ranking}

    </div>

  `;

}


/* -------------------------
   ルーム作成
------------------------- */

$("create").onclick =
async () => {

  try{

    const n =
      $("hostName")
        .value
        .trim() || "プレイヤー1";


    const id =
      code();


    await init();


    await set(
      ref(
        db,
        `rooms/${id}`
      ),
      {
        created:Date.now(),

        hostUid:user.uid,

        roundData:{
          id:0
        }
      }
    );


    await enter(
      id,
      n,
      true
    );


  }catch(error){

    console.error(error);


    alert(
      "ゲームを開始できませんでした。\n" +
      error.message
    );

  }

};


/* -------------------------
   ルーム参加
------------------------- */

$("join").onclick =
async () => {

  try{

    const id =
      $("roomInput")
        .value
        .trim();


    const n =
      $("joinName")
        .value
        .trim() ||
      "プレイヤー";


    if(!/^\d{4}$/.test(id)){

      alert(
        "4桁の参加コードを入力してください"
      );

      return;
    }


    await enter(
      id,
      n,
      false
    );


  }catch(error){

    console.error(error);


    alert(
      "ゲームに参加できませんでした。\n" +
      error.message
    );

  }

};


/* -------------------------
   次のお題
------------------------- */

$("startRound").onclick =
async () => {

  try{

    await init();


    const roomSnap =
      await new Promise(resolve => {

        onValue(
          ref(db,`rooms/${roomId}`),
          snap => resolve(snap),
          {
            onlyOnce:true
          }
        );

      });


    const data =
      roomSnap.val() || {};


    const players =
      getPlayers(data);


    if(players.length < 2){

      alert(
        "2人以上参加してから開始してください。"
      );

      return;
    }


    /*
      参加順でAを決定

      1ラウンド目 → 1人目
      2ラウンド目 → 2人目
      3ラウンド目 → 3人目
      ...
    */

    const nextRound =
      (data.roundData?.roundNumber || 0) + 1;


    const aIndex =
      (nextRound - 1) %
      players.length;


    const aUid =
      players[aIndex][0];


    const line =
      lines[
        Math.floor(
          Math.random() *
          lines.length
        )
      ];


    const expr =
      exprs[
        Math.floor(
          Math.random() *
          exprs.length
        )
      ];


    const roundId =
      Date.now();


    await update(
      ref(db,`rooms/${roomId}`),
      {

        roundData:{

          id:roundId,

          roundNumber:nextRound,

          aUid,

          line,

          expr,

          performed:false,

          performedAt:0,

          finished:false

        },

        answers:{}

      }
    );


  }catch(error){

    console.error(error);


    alert(
      "お題を開始できませんでした。\n" +
      error.message
    );

  }

};


/* -------------------------
   A：表現した
------------------------- */

$("performed").onclick =
async () => {

  try{

    const now =
      Date.now();


    await update(
      ref(
        db,
        `rooms/${roomId}/roundData`
      ),
      {
        performed:true,
        performedAt:now
      }
    );


  }catch(error){

    console.error(error);


    alert(
      "処理に失敗しました。\n" +
      error.message
    );

  }

};


/* -------------------------
   回答
------------------------- */

$("sendAnswer").onclick =
async () => {

  try{

    if(!answer){
      return;
    }


    const roomRef =
      ref(
        db,
        `rooms/${roomId}`
      );


    /*
      現在のお題を取得
    */

    const snap =
      await new Promise(resolve => {

        onValue(
          roomRef,
          s => resolve(s),
          {
            onlyOnce:true
          }
        );

      });


    const data =
      snap.val() || {};


    const rd =
      data.roundData || {};


    const elapsed =
      rd.performedAt
        ? (Date.now() - rd.performedAt) / 1000
        : 999;


    const correct =
      answer === rd.expr;


    const points =
      calculateScore(
        correct,
        elapsed
      );


    /*
      回答を保存
    */

    await set(
      ref(
        db,
        `rooms/${roomId}/answers/${user.uid}`
      ),
      {

        answer,

        correct,

        elapsed,

        points

      }
    );


    /*
      累計スコアを安全に加算
    */

    if(points > 0){

      await runTransaction(
        ref(
          db,
          `rooms/${roomId}/players/${user.uid}/score`
        ),
        current =>
          (current || 0) + points
      );

    }


    stopTimer();


    $("answerCard")
      .classList
      .add("hidden");


    $("roomMessage").textContent =
      `回答しました！ ${points}点`;


  }catch(error){

    console.error(error);


    alert(
      "回答を送信できませんでした。\n" +
      error.message
    );

  }

};


/* -------------------------
   初期化
------------------------- */

init();

</script>
