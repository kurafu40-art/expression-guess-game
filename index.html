<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>表現当てゲーム</title>


<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
  background:#f4f4f5;
  color:#222;
}

main{
  max-width:680px;
  margin:auto;
  padding:16px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin:12px 0;
  box-shadow:0 2px 12px #0001;
}

h1,
h2{
  margin:0 0 12px;
}

.muted{
  color:#777;
  font-size:14px;
}

.big{
  font-size:32px;
  font-weight:800;
  text-align:center;
  line-height:1.4;
  margin:22px 0;
}

button,
input{
  font:inherit;
}

button{
  min-height:46px;
  border:0;
  border-radius:12px;
  padding:10px 15px;
  font-weight:700;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.primary{
  background:#222;
  color:#fff;
  width:100%;
}

.secondary{
  background:#eee;
}

.danger{
  background:#f3dddd;
  color:#a00;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
}

.row{
  display:flex;
  gap:8px;
}

.row>*{
  min-width:0;
}

.row input{
  flex:1;
}

.hidden{
  display:none!important;
}

.center{
  text-align:center;
}

.score{
  font-size:24px;
  font-weight:800;
  margin:10px 0;
}

.list{
  padding:9px 0;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.badge{
  display:inline-block;
  background:#eee;
  border-radius:99px;
  padding:5px 9px;
  font-size:12px;
}

.choice{
  width:100%;
  text-align:left;
  background:#f1f1f1;
  margin:5px 0;
}

.choice.selected{
  outline:3px solid #555;
}

.rank{
  padding:10px 0;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.timer{
  font-size:18px;
  font-weight:700;
  text-align:center;
  margin:10px 0;
}

.done{
  background:#eee;
  color:#555;
}

.waiting{
  text-align:center;
  padding:20px 5px;
  font-weight:700;
}

.correct{
  font-weight:700;
}

.wrong{
  font-weight:700;
}

.result-answer{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

</style>

</head>


<body>


<main>


<!-- ==================================================
     HOME
================================================== -->

<section id="home">


<div class="card">

<h1>
🎭 表現当てゲーム
</h1>

<p class="muted">

1人(表現者)がセリフを指定された表現で演じ、
その人以外の全員が「どんな表現だったか」を当てます。

表現者はラウンドごとに順番に交代します。

正答者にはポイントを付与し、
回答までの時間が短ければさらにボーナスが付きます。

</p>

</div>


<div class="card">

<h2>
ゲームを作る
</h2>

<input
  id="hostName"
  placeholder="あなたの名前"
>

<button
  id="create"
  class="primary"
  style="margin-top:10px"
>
ゲームを作成
</button>

</div>


<div class="card">

<h2>
ゲームに参加
</h2>

<input
  id="roomInput"
  placeholder="4桁の参加コード"
>

<input
  id="joinName"
  placeholder="名前"
  style="margin-top:8px"
>

<button
  id="join"
  class="primary"
  style="margin-top:10px"
>
参加する
</button>

</div>


<div class="card">

<button
  id="editorOpen"
  class="secondary"
  style="width:100%"
>
セリフ・表現を編集
</button>

</div>


</section>


<!-- ==================================================
     ROOM
================================================== -->

<section
  id="room"
  class="hidden"
>


<div class="card center">

<span class="badge">
参加コード
</span>

<div
  class="big"
  id="roomCode"
></div>

<p id="players"></p>

<div class="score">

あなたの得点：

<span id="myScore">
0
</span>

点

</div>

</div>


<!-- 次のお題 -->

<div
  class="card hidden"
  id="hostControls"
>

<button
  id="startRound"
  class="primary"
>
次のお題を開始
</button>

</div>


<!-- 役割 -->

<div class="card">

<h2 id="roleTitle">
</h2>

<div
  id="roomMessage"
  class="muted"
></div>

</div>


<!-- ==================================================
     A
================================================== -->

<div
  class="card hidden"
  id="promptCard"
>

<span class="badge">
Aだけ見る
</span>


<div class="big">

「<span id="line"></span>」を<br>

「<span id="expr"></span>」で表現！

</div>


<button
  id="performed"
  class="primary"
>
表現した！
</button>

</div>


<!-- ==================================================
     B
================================================== -->

<div
  class="card hidden"
  id="answerCard"
>

<h2>
回答
</h2>

<p class="muted">
Aはどんな表現をしていましたか？
</p>


<div
  id="timer"
  class="timer"
>
0.0秒
</div>


<div id="choices"></div>


<button
  id="sendAnswer"
  class="primary"
  disabled
>
回答する
</button>

</div>


<!-- ==================================================
     結果
================================================== -->

<div
  class="card hidden"
  id="resultCard"
>

<h2>
結果
</h2>

<div id="result"></div>

</div>


</section>


<!-- ==================================================
     EDITOR
================================================== -->

<section
  id="editor"
  class="hidden"
>


<div class="card">

<h2>
セリフ
</h2>


<div class="row">

<input
  id="newLine"
  placeholder="例：好き"
>

<button id="addLine">
追加
</button>

</div>


<div id="lineList"></div>

</div>


<div class="card">

<h2>
表現
</h2>


<div class="row">

<input
  id="newExpr"
  placeholder="例：照れて"
>

<button id="addExpr">
追加
</button>

</div>


<div id="exprList"></div>

</div>


<div class="card">

<button
  id="editorBack"
  class="secondary"
  style="width:100%"
>
戻る
</button>

</div>


</section>


</main>

/* ==================================================
   LocalStorage
================================================== */

let savedLines =
  JSON.parse(
    localStorage.getItem("lines") || "null"
  );


let savedExprs =
  JSON.parse(
    localStorage.getItem("exprs") || "null"
  );


let lines = savedLines

  ? [
      ...savedLines,
      ...defaultLines.filter(
        x => !savedLines.includes(x)
      )
    ]

  : [...defaultLines];


let exprs = savedExprs

  ? [
      ...savedExprs,
      ...defaultExpr.filter(
        x => !savedExprs.includes(x)
      )
    ]

  : [...defaultExpr];


localStorage.setItem(
  "lines",
  JSON.stringify(lines)
);


localStorage.setItem(
  "exprs",
  JSON.stringify(exprs)
);


/* ==================================================
   ゲーム変数
================================================== */

let app;

let db;

let auth;

let user;

let roomId;

let name;

let isHost = false;

let round = 0;

let answer = "";

let unsub;

let timerInterval = null;

let currentAnswerRound = null;

let performedLocked = false;

let answerSubmittedRound = null;


/* ==================================================
   Firebase初期化
================================================== */

async function init(){

  if(!app){

    app =
      initializeApp(
        firebaseConfig
      );


    db =
      getDatabase(app);


    auth =
      getAuth(app);


    await signInAnonymously(
      auth
    );


    user =
      auth.currentUser;

  }


  if(!user){

    user =
      auth.currentUser;

  }

}


/* ==================================================
   画面切り替え
================================================== */

function show(id){

  [
    "home",
    "room",
    "editor"
  ]
  .forEach(x => {

    $(x)
      .classList
      .add("hidden");

  });


  $(id)
    .classList
    .remove("hidden");

}


/* ==================================================
   ルームコード
================================================== */

function code(){

  return String(
    Math.floor(
      1000 +
      Math.random() * 9000
    )
  );

}


/* ==================================================
   シャッフル
================================================== */

function shuffle(array){

  return array
    .slice()
    .sort(
      () =>
        Math.random() - 0.5
    );

}


/* ==================================================
   エディタ表示
================================================== */

function renderEditor(){

  $("lineList").innerHTML =

    lines.map(
      (x,i) => `

        <div class="list">

          <span>
            ${x}
          </span>

          <button
            class="danger"
            onclick="delLine(${i})"
          >
            削除
          </button>

        </div>

      `
    ).join("");


  $("exprList").innerHTML =

    exprs.map(
      (x,i) => `

        <div class="list">

          <span>
            ${x}
          </span>

          <button
            class="danger"
            onclick="delExpr(${i})"
          >
            削除
          </button>

        </div>

      `
    ).join("");

}


window.delLine = i => {

  if(lines.length <= 1){

    return;

  }


  lines.splice(i,1);


  localStorage.setItem(
    "lines",
    JSON.stringify(lines)
  );


  renderEditor();

};


window.delExpr = i => {

  if(exprs.length <= 1){

    return;

  }


  exprs.splice(i,1);


  localStorage.setItem(
    "exprs",
    JSON.stringify(exprs)
  );


  renderEditor();

};


$("editorOpen").onclick = () => {

  renderEditor();

  show("editor");

};


$("editorBack").onclick = () => {

  show("home");

};


$("addLine").onclick = () => {

  const value =
    $("newLine")
      .value
      .trim();


  if(!value){

    return;

  }


  lines.push(value);


  localStorage.setItem(
    "lines",
    JSON.stringify(lines)
  );


  $("newLine").value = "";


  renderEditor();

};


$("addExpr").onclick = () => {

  const value =
    $("newExpr")
      .value
      .trim();


  if(!value){

    return;

  }


  exprs.push(value);


  localStorage.setItem(
    "exprs",
    JSON.stringify(exprs)
  );


  $("newExpr").value = "";


  renderEditor();

};


/* ==================================================
   プレイヤー取得
================================================== */

function getPlayers(data){

  return Object.entries(
    data.players || {}
  )

  .filter(
    ([id,p]) =>
      p.online
  )

  .sort(
    (a,b) =>
      (a[1].joinedAt || 0) -
      (b[1].joinedAt || 0)
  );

}


/* ==================================================
   ルーム参加
================================================== */

async function enter(
  id,
  n,
  host
){

  await init();


  roomId = id;

  name = n;

  isHost = host;


  const playerRef =
    ref(
      db,
      `rooms/${id}/players/${user.uid}`
    );


  await set(
    playerRef,
    {

      name:n,

      online:true,

      joinedAt:Date.now(),

      score:0

    }
  );


  onDisconnect(
    playerRef
  )
  .update({
    online:false
  });


  $("roomCode")
    .textContent = id;


  show("room");


  unsub?.();


  unsub =
    onValue(
      ref(
        db,
        `rooms/${id}`
      ),
      snapshot => {

        sync(
          snapshot.val() || {}
        );

      }
    );

}


/* ==================================================
   ゲーム同期
================================================== */

function sync(data){

  const players =
    getPlayers(data);


  $("players")
    .textContent =
      "参加者：" +
      players
        .map(
          ([id,p]) =>
            `${p.name} (${p.score || 0}点)`
        )
        .join("、");


  const myPlayer =
    data.players?.[user?.uid];


  $("myScore")
    .textContent =
      myPlayer?.score || 0;


  const rd =
    data.roundData || {};


  round =
    rd.id || 0;


  /* ==================================================
     ゲーム開始前
  ================================================== */

  if(!round){

    $("promptCard")
      .classList
      .add("hidden");


    $("answerCard")
      .classList
      .add("hidden");


    $("resultCard")
      .classList
      .add("hidden");


    $("roleTitle")
      .textContent =
        "ゲーム開始待ち";


    $("roomMessage")
      .textContent =
        "ゲーム作成者が「次のお題を開始」を押してください。";


    $("hostControls")
      .classList
      .toggle(
        "hidden",
        !isHost
      );


    return;

  }


  const isA =
    rd.aUid === user.uid;


  /* ==================================================
     結果カードは基本的に非表示
     
     finished:trueになった時だけ
     下で表示する
  ================================================== */

  if(!rd.finished){

    $("resultCard")
      .classList
      .add("hidden");

  }


  /* ==================================================
     次のお題ボタン
  ================================================== */

  $("hostControls")
    .classList
    .toggle(
      "hidden",
      !isA
    );


  /* ==================================================
     ラウンドが変わった時
  ================================================== */

  if(
    currentAnswerRound !== rd.id
  ){

    answerSubmittedRound = null;

  }


  /* ==================================================
     A
  ================================================== */

  if(isA){

    $("roleTitle")
      .textContent =
        "🎭 あなたはA（演じる人）";


    $("promptCard")
      .classList
      .remove("hidden");


    $("answerCard")
      .classList
      .add("hidden");


    $("line")
      .textContent =
        rd.line || "";


    $("expr")
      .textContent =
        rd.expr || "";


    if(rd.performed){

      performedLocked = true;


      $("performed")
        .disabled = true;


      $("performed")
        .classList
        .add("done");


      $("performed")
        .textContent =
          "表現済み";


      $("roomMessage")
        .textContent =
          "全員の回答を待っています。";

    }else{

      performedLocked = false;


      $("performed")
        .disabled = false;


      $("performed")
        .classList
        .remove("done");


      $("performed")
        .textContent =
          "表現した！";


      $("roomMessage")
        .textContent =
          "お題を確認して表現してください。";

    }

  }


  /* ==================================================
     B
  ================================================== */

  if(!isA){

    $("roleTitle")
      .textContent =
        "🎯 あなたはB（答える人）";


    $("promptCard")
      .classList
      .add("hidden");


    /*
      このラウンドですでに回答済みか
    */

    const myAnswer =
      data.answers?.[user.uid];


    const alreadyAnswered =
      myAnswer &&
      myAnswer.roundId === rd.id;


    /* ----------------------------------------------
       すでに回答済み
       
       ★ここでは正解・点数を表示しない
    ---------------------------------------------- */

    if(alreadyAnswered){

      answerSubmittedRound =
        rd.id;


      stopTimer();


      $("answerCard")
        .classList
        .add("hidden");


      /*
        finishedになるまでは
        待機メッセージだけ
      */

      if(!rd.finished){

        $("roomMessage")
          .textContent =
            "回答を受け付けました。全員の回答を待っています。";

      }

    }


    /* ----------------------------------------------
       ローカル上でも回答済み
    ---------------------------------------------- */

    else if(
      answerSubmittedRound === rd.id
    ){

      $("answerCard")
        .classList
        .add("hidden");


      stopTimer();


      if(!rd.finished){

        $("roomMessage")
          .textContent =
            "回答を受け付けました。全員の回答を待っています。";

      }

    }


    /* ----------------------------------------------
       Aが表現済み
       
       まだ自分が回答していない
    ---------------------------------------------- */

    else if(
      rd.performed &&
      !rd.finished
    ){

      makeChoices(
        rd.expr,
        rd.performedAt,
        rd.id
      );


      $("answerCard")
        .classList
        .remove("hidden");


      $("roomMessage")
        .textContent =
          "Aの表現を見て回答してください。";

    }


    /* ----------------------------------------------
       Aがまだ表現していない
    ---------------------------------------------- */

    else{

      $("answerCard")
        .classList
        .add("hidden");


      $("roomMessage")
        .textContent =
          "Aが表現するのを待っています。";

    }

  }


  /* ==================================================
     全員回答済み判定
     
     A本人がFirebase上の回答数を確認して
     finished:trueにする
  ================================================== */

  if(
    isA &&
    rd.performed &&
    !rd.finished
  ){

    const answerPlayers =
      players.filter(
        ([id]) =>
          id !== rd.aUid
      );


    const answeredCount =
      answerPlayers.filter(
        ([id]) =>
          data.answers?.[id]?.roundId === rd.id
      ).length;


    /*
      A以外の全員が回答した場合のみ
      finished:true
    */

    if(
      answerPlayers.length > 0 &&
      answeredCount >= answerPlayers.length
    ){

      await update(
        ref(
          db,
          `rooms/${roomId}/roundData`
        ),
        {
          finished:true
        }
      );

    }

  }


  /* ==================================================
     ラウンド終了
     
     ★ここで初めて結果を表示
  ================================================== */

  if(rd.finished){

    $("promptCard")
      .classList
      .add("hidden");


    $("answerCard")
      .classList
      .add("hidden");


    $("resultCard")
      .classList
      .remove("hidden");


    stopTimer();


    renderResults(data);


    /*
      次のお題を開始できるのは
      今回のAだけ
    */

    $("hostControls")
      .classList
      .toggle(
        "hidden",
        !isA
      );

  }

}


/* ==================================================
   回答選択肢
================================================== */

function makeChoices(
  correct,
  performedAt,
  roundId
){

  if(
    answerSubmittedRound === roundId
  ){

    return;

  }


  /*
    すでに同じラウンドで
    選択肢を作っている場合
  */

  if(
    currentAnswerRound === roundId
  ){

    startTimer(
      performedAt
    );

    return;

  }


  currentAnswerRound =
    roundId;


  answer = "";


  $("sendAnswer")
    .disabled = true;


  $("choices")
    .innerHTML = "";


  const wrongAnswers =
    shuffle(
      exprs.filter(
        x =>
          x !== correct
      )
    )
    .slice(
      0,
      7
    );


  const choices =
    shuffle([
      correct,
      ...wrongAnswers
    ]);


  choices.forEach(
    x => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "choice";


      button.textContent =
        x;


      button.onclick = () => {

        if(
          answerSubmittedRound === roundId
        ){

          return;

        }


        document
          .querySelectorAll(
            "#choices .choice"
          )
          .forEach(
            element =>
              element
                .classList
                .remove("selected")
          );


        button
          .classList
          .add("selected");


        answer = x;


        $("sendAnswer")
          .disabled = false;

      };


      $("choices")
        .appendChild(button);

    }
  );


  startTimer(
    performedAt
  );

}


/* ==================================================
   タイマー
================================================== */

function startTimer(
  startedAt
){

  if(!startedAt){

    return;

  }


  stopTimer();


  function updateTimer(){

    const elapsed =
      (
        Date.now() -
        startedAt
      ) / 1000;


    $("timer")
      .textContent =
        elapsed.toFixed(1) +
        "秒";

  }


  updateTimer();


  timerInterval =
    setInterval(
      updateTimer,
      100
    );

}


function stopTimer(){

  if(timerInterval){

    clearInterval(
      timerInterval
    );

    timerInterval = null;

  }

}


/* ==================================================
   得点計算
================================================== */

function calculateScore(
  isCorrect,
  elapsed
){

  if(!isCorrect){

    return 0;

  }


  if(elapsed <= 5){

    return 150;

  }


  if(elapsed <= 10){

    return 130;

  }


  if(elapsed <= 20){

    return 110;

  }


  return 100;

}


/* ==================================================
   結果表示
================================================== */

function renderResults(data){

  const rd =
    data.roundData || {};


  const answers =
    data.answers || {};


  /*
    今回の回答だけ取得
  */

  const currentAnswers =
    Object.entries(
      answers
    )
    .filter(
      ([id,value]) =>
        value.roundId === rd.id
    );


  /*
    回答者ごとの結果
  */

  const answerRows =
    currentAnswers
      .map(
        ([id,value]) => {

          const player =
            data.players?.[id];


          if(!player){

            return "";

          }


          const isCorrect =
            value.answer === rd.expr;


          const points =
            value.points || 0;


          const elapsed =
            value.elapsed || 0;


          return `

            <div class="result-answer">

              <div
                style="
                  display:flex;
                  justify-content:space-between;
                  gap:8px;
                "
              >

                <strong>
                  ${player.name}
                </strong>

                <strong>

                  ${
                    isCorrect
                      ? "⭕ 正解"
                      : "❌ 不正解"
                  }

                </strong>

              </div>


              <div
                class="${
                  isCorrect
                    ? "correct"
                    : "wrong"
                }"
                style="margin-top:6px"
              >

                回答：
                ${value.answer || "回答なし"}

              </div>


              ${
                isCorrect
                  ? `
                    <div
                      class="muted"
                      style="margin-top:5px"
                    >
                      回答時間：
                      ${elapsed.toFixed(1)}秒
                    </div>
                  `
                  : ""
              }


              <div
                style="margin-top:5px"
              >

                獲得：
                <strong>
                  ${points}点
                </strong>

              </div>

            </div>

          `;

        }
      )
      .filter(Boolean)
      .join("");


  /*
    累計ランキング
  */

  const ranking =
    Object.entries(
      data.players || {}
    )
    .sort(
      (a,b) =>
        (b[1].score || 0) -
        (a[1].score || 0)
    )
    .map(
      ([id,player],index) => `

        <div class="rank">

          <span>

            ${index + 1}位　
            ${player.name}

          </span>


          <strong>

            ${player.score || 0}点

          </strong>

        </div>

      `
    )
    .join("");


  $("result").innerHTML = `

    <div class="card">

      <div class="muted">
        今回のお題
      </div>


      <div
        style="
          font-size:20px;
          font-weight:700;
          margin:8px 0 20px;
        "
      >

        「${rd.line}」

      </div>


      <div class="muted">
        正解
      </div>


      <div class="big">

        「${rd.expr}」

      </div>


      ${
        answerRows ||
        `
          <p class="muted">
            回答はありませんでした。
          </p>
        `
      }

    </div>


    <div class="card">

      <h2>
        🏆 現在の順位
      </h2>

      ${ranking}

    </div>

  `;

}

/* ==================================================
   ゲーム参加
================================================== */

$("join").onclick =

  try{

        .value

/* ==================================================
   次のお題を開始
================================================== */

$("startRound").onclick =
async () => {

  try{

    await init();


    const snapshot =
      await get(
        ref(
          db,
          `rooms/${roomId}`
        )
      );


    const data =
      snapshot.val() || {};


    const players =
      getPlayers(data);


    if(
      players.length < 2
    ){

      alert(
        "2人以上参加してから開始してください。"
      );

      return;

    }


    const currentRoundData =
      data.roundData || {};


    const currentRoundId =
      currentRoundData.id || 0;


    /* ----------------------------------------------
       最初のお題
       → ゲーム作成者のみ
    ---------------------------------------------- */

    if(!currentRoundId){

      if(
        data.hostUid !== user.uid
      ){

        alert(
          "ゲーム作成者だけが最初のお題を開始できます。"
        );

        return;

      }

    }


    /* ----------------------------------------------
       2ラウンド目以降
       → 前ラウンドのAのみ
    ---------------------------------------------- */

    else{

      if(
        currentRoundData.aUid !== user.uid
      ){

        alert(
          "次のお題を開始できるのは、そのラウンドの表現者だけです。"
        );

        return;

      }


      if(
        !currentRoundData.finished
      ){

        alert(
          "全員の回答が終わってから次のお題を開始してください。"
        );

        return;

      }

    }


    /*
      次のラウンド番号
    */

    const nextRound =
      (
        currentRoundData.roundNumber || 0
      ) + 1;


    /*
      Aを参加順で決定

      1ラウンド目 → 1人目
      2ラウンド目 → 2人目
      3ラウンド目 → 3人目
      ...
    */

    const aIndex =
      (
        nextRound - 1
      ) %
      players.length;


    const aUid =
      players[aIndex][0];


    /*
      セリフ
    */

    const line =
      lines[
        Math.floor(
          Math.random() *
          lines.length
        )
      ];


    /*
      表現
    */

    const expr =
      exprs[
        Math.floor(
          Math.random() *
          exprs.length
        )
      ];


    const roundId =
      Date.now();


    /*
      ラウンド作成
    */

    await update(
      ref(
        db,
        `rooms/${roomId}`
      ),
      {

        roundData:{

          id:
            roundId,

          roundNumber:
            nextRound,

          aUid:
            aUid,

          line:
            line,

          expr:
            expr,

          performed:
            false,

          performedAt:
            0,

          finished:
            false

        },

        answers:{}

      }
    );


    /*
      ローカル状態リセット
    */

    performedLocked = false;

    currentAnswerRound = null;

    answerSubmittedRound = null;

    answer = "";


    $("performed")
      .disabled = false;


    $("performed")
      .classList
      .remove("done");


    $("performed")
      .textContent =
        "表現した！";


    $("sendAnswer")
      .disabled = true;


    $("resultCard")
      .classList
      .add("hidden");


  }catch(error){

    console.error(error);


    alert(
      "お題を開始できませんでした。\n" +
      error.message
    );

  }

};


/* ==================================================
   A：表現した！
================================================== */

$("performed").onclick =
async () => {

  try{

    if(performedLocked){

      return;

    }


    performedLocked = true;


    $("performed")
      .disabled = true;


    $("performed")
      .classList
      .add("done");


    $("performed")
      .textContent =
        "表現済み";


    const snapshot =
      await get(
        ref(
          db,
          `rooms/${roomId}/roundData`
        )
      );


    const rd =
      snapshot.val() || {};


    /*
      すでに表現済み
    */

    if(rd.performed){

      return;

    }


    /*
      A本人か確認
    */

    if(
      rd.aUid !== user.uid
    ){

      return;

    }


    const now =
      Date.now();


    await update(
      ref(
        db,
        `rooms/${roomId}/roundData`
      ),
      {

        performed:
          true,

        performedAt:
          now

      }
    );


  }catch(error){

    console.error(error);


    performedLocked = false;


    $("performed")
      .disabled = false;


    $("performed")
      .classList
      .remove("done");


    $("performed")
      .textContent =
        "表現した！";


    alert(
      "処理に失敗しました。\n" +
      error.message
    );

  }

};


/* ==================================================
   B：回答送信
================================================== */

$("sendAnswer").onclick =
async () => {

  try{

    if(!answer){

      return;

    }


    /*
      連打防止
    */

    $("sendAnswer")
      .disabled = true;


    const snapshot =
      await get(
        ref(
          db,
          `rooms/${roomId}`
        )
      );


    const data =
      snapshot.val() || {};


    const rd =
      data.roundData || {};


    /*
      すでに回答済み
    */

    const existingAnswer =
      data.answers?.[user.uid];


    if(
      existingAnswer &&
      existingAnswer.roundId === rd.id
    ){

      answerSubmittedRound =
        rd.id;


      stopTimer();


      $("answerCard")
        .classList
        .add("hidden");


      $("roomMessage")
        .textContent =
          "回答を受け付けました。全員の回答を待っています。";


      return;

    }


    /*
      Aは回答できない
    */

    if(
      rd.aUid === user.uid
    ){

      $("sendAnswer")
        .disabled = true;

      return;

    }


    /*
      Aがまだ表現していない
    */

    if(!rd.performed){

      $("sendAnswer")
        .disabled = false;

      return;

    }


    /*
      回答時間
    */

    const elapsed =
      rd.performedAt
        ? (
            Date.now() -
            rd.performedAt
          ) / 1000
        : 999;


    /*
      正解判定
    */

    const correct =
      answer === rd.expr;


    /*
      得点
    */

    const points =
      calculateScore(
        correct,
        elapsed
      );


    /*
      回答をFirebaseへ保存

      ★ここでは結果を表示しない
    */

    await set(
      ref(
        db,
        `rooms/${roomId}/answers/${user.uid}`
      ),
      {

        roundId:
          rd.id,

        answer:
          answer,

        correct:
          correct,

        elapsed:
          elapsed,

        points:
          points

      }
    );


    /*
      正解なら累計点へ加算
    */

    if(points > 0){

      await runTransaction(
        ref(
          db,
          `rooms/${roomId}/players/${user.uid}/score`
        ),
        current =>

          (current || 0) +
          points
      );

    }


    /*
      回答済みにする
    */

    answerSubmittedRound =
      rd.id;


    stopTimer();


    /*
      回答選択肢を隠す
    */

    $("answerCard")
      .classList
      .add("hidden");


    /*
      ★重要
      正解・点数はここでは表示しない
    */

    $("roomMessage")
      .textContent =
        "回答を受け付けました。全員の回答を待っています。";


    answer = "";


  }catch(error){

    console.error(error);


    $("sendAnswer")
      .disabled = false;


    alert(
      "回答を送信できませんでした。\n" +
      error.message
    );

  }

};

   初期化
================================================== */

init();
