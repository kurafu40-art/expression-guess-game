function getPlayers(data){

  return Object.entries(
    data.players || {}
  )

  .filter(
    ([id,p]) =>
      p &&
      p.online
  )

  .sort(
    (a,b) =>
      (a[1].joinedAt || 0) -
      (b[1].joinedAt || 0)
  );

}


/* ==================================================
   ラウンド進行中に表示する得点
================================================== */

/*
  回答時にはまだ累計得点を増やさない。

  ただし、得点加算処理中にFirebaseから
  score更新だけ先に届く場合があるため、
  結果確定前は今回のラウンド分を差し引いて表示する。

  これにより、

  回答
    ↓
  待機
    ↓
  全員回答
    ↓
  得点加算
    ↓
  finished:true
    ↓
  結果表示

  という流れを維持できる。
*/

function getDisplayScore(
  player,
  playerId,
  data
){

  const actualScore =
    player?.score || 0;


  const rd =
    data.roundData || {};


  if(
    rd.finished ||
    !rd.id ||
    !rd.scoresApplying
  ){

    return actualScore;

  }


  const roundAnswer =
    data.answers?.[playerId];


  const points =
    roundAnswer &&
    roundAnswer.roundId === rd.id
      ? Number(
          roundAnswer.points || 0
        )
      : 0;


  return Math.max(
    0,
    actualScore - points
  );

}

async function enter(
  id,
  n,
  host
){

  await init();


  const roomSnapshot =
    await get(
      ref(
        db,
        `rooms/${id}`
      )
    );


  /*
    参加の場合、
    存在しないルームには入れない
  */

  if(
    !host &&
    !roomSnapshot.exists()
  ){

    throw new Error(
      "その参加コードのゲームは存在しません。"
    );

  }


  roomId = id;

  name = n;

  isHost = host;


  const playerRef =
    ref(
      db,
      `rooms/${id}/players/${user.uid}`
    );


  /*
    既存プレイヤーなら
    得点を0に戻さない
  */

  const existingPlayer =
    roomSnapshot.val()
      ?.players?.[user.uid];


  await set(
    playerRef,
    {

      name:n,

      online:true,

      joinedAt:
        existingPlayer?.joinedAt ||
        Date.now(),

      score:
        existingPlayer?.score ||
        0

    }
  );


  onDisconnect(
    playerRef
  )
  .update({
    online:false
  });


  $("roomCode")
    .textContent = id;


  show("room");


  unsub?.();


  unsub =
    onValue(
      ref(
        db,
        `rooms/${id}`
      ),
      snapshot => {

        sync(
          snapshot.val() || {}
        );

      }
    );

}

    settlingRoundId === rd.id
  ){

    return;

  }


  /*
    Firebase上ですでに得点処理済みなら
    二重加算しない
  */

  if(
    rd.scoresApplied
  ){

    return;

  }


  settlingRoundId =
    rd.id;


  try{

    const answers =
      data.answers || {};


    /*
      A以外の今回の回答を確認
    */

    const currentAnswers =
      Object.entries(
        answers
      )
      .filter(
        ([id,value]) =>
          value &&
          value.roundId === rd.id &&
          id !== rd.aUid
      );


    /*
      各回答者の得点を加算。

      ここまでの段階では
      roundData.finished は false のまま。

      そのため結果画面は表示されない。
    */

    for(
      const [playerId,value]
      of currentAnswers
    ){

      const points =
        Number(
          value.points || 0
        );


      if(points <= 0){

        continue;

      }


      await runTransaction(
        ref(
          db,
          `rooms/${roomId}/players/${playerId}/score`
        ),
        current =>

          (current || 0) +
          points
      );

    }


    /*
      全員分の得点加算が完了したあとで
      はじめて結果確定。

      scoresApplying:true を記録することで
      得点処理済みであることも保存する。
    */

    await update(
      ref(
        db,
        `rooms/${roomId}/roundData`
      ),
      {

        scoresApplied:
          true,

        finished:
          true

      }
    );


  }catch(error){

    console.error(
      "得点処理エラー:",
      error
    );

  }finally{

    settlingRoundId = null;

  }

}


/* ==================================================
   ゲーム同期
================================================== */

async function sync(data){

  if(!user){

    return;

  }


  const players =
    getPlayers(data);


  const rd =
    data.roundData || {};


  /*
    結果確定前の表示用得点を計算
  */

  $("players")
    .textContent =
      "参加者：" +
      (
        players.length
          ? players
              .map(
                ([id,p]) =>
                  `${p.name} (${getDisplayScore(p,id,data)}点)`
              )
              .join("、")
          : "なし"
      );


  const myPlayer =
    data.players?.[user.uid];


  $("myScore")
    .textContent =
      getDisplayScore(
        myPlayer,
        user.uid,
        data
      );


  round =
    rd.id || 0;


  /* ==================================================
     ゲーム開始前
  ================================================== */

  if(!round){

    $("promptCard")
      .classList
      .add("hidden");


    $("answerCard")
      .classList
      .add("hidden");


    $("resultCard")
      .classList
      .add("hidden");


    $("roleTitle")
      .textContent =
        "ゲーム開始待ち";


    $("roomMessage")
      .textContent =
        "ゲーム作成者が「次のお題を開始」を押してください。";


    /*
      ゲーム開始前だけ
      ホストにボタンを表示
    */

    $("hostControls")
      .classList
      .toggle(
        "hidden",
        !isHost
      );


    return;

  }


  const isA =
    rd.aUid === user.uid;


  /* ==================================================
     ラウンド変更
  ================================================== */

  if(
    currentAnswerRound !== rd.id
  ){

    answerSubmittedRound = null;

  }


  /* ==================================================
     まだ終了していない
  ================================================== */

  if(!rd.finished){

    $("resultCard")
      .classList
      .add("hidden");


    /*
      ラウンド進行中は
      「次のお題を開始」を全員に非表示
    */

    $("hostControls")
      .classList
      .add("hidden");

  }


  /* ==================================================
     A
  ================================================== */

  if(isA){

    $("roleTitle")
      .textContent =
        "🎭 あなたはA（演じる人）";


    $("promptCard")
      .classList
      .remove("hidden");


    $("answerCard")
      .classList
      .add("hidden");


    $("line")
      .textContent =
        rd.line || "";


    $("expr")
      .textContent =
        rd.expr || "";


    if(rd.performed){

      performedLocked = true;


      $("performed")
        .disabled = true;


      $("performed")
        .classList
        .add("done");


      $("performed")
        .textContent =
        "表現済み";


      $("roomMessage")
        .textContent =
        rd.finished
          ? "ラウンド終了"
          : "全員の回答を待っています。";

    }else{

      performedLocked = false;


      $("performed")
        .disabled = false;


      $("performed")
        .classList
        .remove("done");


      $("performed")
        .textContent =
        "表現した！";


      $("roomMessage")
        .textContent =
        "お題を確認して表現してください。";

    }

  }


  /* ==================================================
     B
  ================================================== */

  else{

    $("roleTitle")
      .textContent =
        "🎯 あなたはB（答える人）";


    $("promptCard")
      .classList
      .add("hidden");


    const myAnswer =
      data.answers?.[user.uid];


    const alreadyAnswered =
      myAnswer &&
      myAnswer.roundId === rd.id;


    /* ----------------------------------------------
       回答済み
    ---------------------------------------------- */

    if(alreadyAnswered){

      answerSubmittedRound =
        rd.id;


      stopTimer();


      $("answerCard")
        .classList
        .add("hidden");


      if(!rd.finished){

        $("roomMessage")
          .textContent =
          "回答を受け付けました。全員の回答を待っています。";

      }

    }


    /* ----------------------------------------------
       ローカル上で回答済み
    ---------------------------------------------- */

    else if(
      answerSubmittedRound === rd.id
    ){

      $("answerCard")
        .classList
        .add("hidden");


      stopTimer();


      if(!rd.finished){

        $("roomMessage")
          .textContent =
          "回答を受け付けました。全員の回答を待っています。";

      }

    }


    /* ----------------------------------------------
       Aが表現済み
    ---------------------------------------------- */

    else if(
      rd.performed &&
      !rd.finished
    ){

      makeChoices(
        rd.expr,
        rd.performedAt,
        rd.id
      );


      $("answerCard")
        .classList
        .remove("hidden");


      $("roomMessage")
        .textContent =
        "Aの表現を見て回答してください。";

    }


    /* ----------------------------------------------
       Aがまだ表現していない
    ---------------------------------------------- */

    else if(!rd.finished){

      $("answerCard")
        .classList
        .add("hidden");


      $("roomMessage")
        .textContent =
        "Aが表現するのを待っています。";

    }

  }


  /* ==================================================
     全員回答済み判定
  ================================================== */

  if(
    isA &&
    rd.performed &&
    !rd.finished &&
    !rd.scoresApplied &&
    settlingRoundId !== rd.id
  ){

    const answerPlayers =
      players.filter(
        ([id]) =>
          id !== rd.aUid
      );


    /*
      A以外のプレイヤーのうち
      今回のroundIdで回答済みの人数
    */

    const answeredCount =
      answerPlayers.filter(
        ([id]) =>
          data.answers?.[id]?.roundId === rd.id
      ).length;


    /*
      A以外の全員が回答した場合
    */

    if(
      answerPlayers.length > 0 &&
      answeredCount === answerPlayers.length
    ){

      /*
        得点加算が完了するまで
        finished:trueにはしない。

        そのため、この時点では
        結果は表示されない。
      */

      await applyRoundScores(
        data,
        rd
      );

    }

  }


  /* ==================================================
     ラウンド終了
  ================================================== */

  if(rd.finished){

    $("promptCard")
      .classList
      .add("hidden");


    $("answerCard")
      .classList
      .add("hidden");


    $("resultCard")
      .classList
      .remove("hidden");


    stopTimer();


    renderResults(data);


    /*
      次のお題を開始できるのは
      今回のラウンドでAだった人だけ。

      次のラウンドが開始されると
      rd.finished:falseになるため、
      上記の「ラウンド進行中」で
      自動的に非表示になる。
    */

    $("hostControls")
      .classList
      .toggle(
        "hidden",
        !isA
      );

  }

}


/* ==================================================
   回答選択肢
================================================== */

function makeChoices(
  correct,
  performedAt,
  roundId
){

  if(
    answerSubmittedRound === roundId
  ){

    return;

  }


  if(
    currentAnswerRound === roundId
  ){

    startTimer(
      performedAt
    );

    return;

  }


  currentAnswerRound =
    roundId;


  answer = "";


  $("sendAnswer")
    .disabled = true;


  $("choices")
    .innerHTML = "";


  const wrongAnswers =
    shuffle(
      exprs.filter(
        x =>
          x !== correct
      )
    )
    .slice(
      0,
      7
    );


  const choices =
    shuffle([
      correct,
      ...wrongAnswers
    ]);


  choices.forEach(
    x => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "choice";


      button.textContent =
        x;


      button.onclick = () => {

        if(
          answerSubmittedRound === roundId
        ){

          return;

        }


        document
          .querySelectorAll(
            "#choices .choice"
          )
          .forEach(
            element =>
              element
                .classList
                .remove("selected")
          );


        button
          .classList
          .add("selected");


        answer = x;


        $("sendAnswer")
          .disabled = false;

      };


      $("choices")
        .appendChild(button);

    }
  );


  startTimer(
    performedAt
  );

}


/* ==================================================
   タイマー
================================================== */

function startTimer(
  startedAt
){

  if(!startedAt){

    return;

  }


  stopTimer();


  function updateTimer(){

    const elapsed =
      (
        Date.now() -
        startedAt
      ) / 1000;


    $("timer")
      .textContent =
        elapsed.toFixed(1) +
        "秒";

  }


  updateTimer();


  timerInterval =
    setInterval(
      updateTimer,
      100
    );

}


function stopTimer(){

  if(timerInterval){

    clearInterval(
      timerInterval
    );

    timerInterval = null;

  }

}


/* ==================================================
   得点計算
================================================== */

function calculateScore(
  isCorrect,
  elapsed
){

  if(!isCorrect){

    return 0;

  }


  if(elapsed <= 5){

    return 150;

  }


  if(elapsed <= 10){

    return 130;

  }


  if(elapsed <= 20){

    return 110;

  }


  return 100;

}


/* ==================================================
   結果表示
================================================== */

function renderResults(data){

  const rd =
    data.roundData || {};


  const answers =
    data.answers || {};


  const currentAnswers =
    Object.entries(
      answers
    )
    .filter(
      ([id,value]) =>
        value &&
        value.roundId === rd.id
    );


  const answerRows =
    currentAnswers
      .map(
        ([id,value]) => {

          const player =
            data.players?.[id];


          if(!player){

            return "";

          }


          const isCorrect =
            value.answer === rd.expr;


          const points =
            value.points || 0;


          const elapsed =
            value.elapsed || 0;


          return `

            <div class="result-answer">

              <div
                style="
                  display:flex;
                  justify-content:space-between;
                  gap:8px;
                "
              >

                <strong>
                  ${player.name}
                </strong>

                <strong>

                  ${
                    isCorrect
                      ? "⭕ 正解"
                      : "❌ 不正解"
                  }

                </strong>

              </div>


              <div
                class="${
                  isCorrect
                    ? "correct"
                    : "wrong"
                }"
                style="margin-top:6px"
              >

                回答：
                ${value.answer || "回答なし"}

              </div>


              ${
                isCorrect
                  ? `
                    <div
                      class="muted"
                      style="margin-top:5px"
                    >
                      回答時間：
                      ${elapsed.toFixed(1)}秒
                    </div>
                  `
                  : ""
              }


              <div
                style="margin-top:5px"
              >

                獲得：
                <strong>
                  ${points}点
                </strong>

              </div>

            </div>

          `;

        }
      )
      .filter(Boolean)
      .join("");


  const ranking =
    Object.entries(
      data.players || {}
    )
    .filter(
      ([id,player]) =>
        player
    )
    .sort(
      (a,b) =>
        (b[1].score || 0) -
        (a[1].score || 0)
    )
    .map(
      ([id,player],index) => `

        <div class="rank">

          <span>

            ${index + 1}位　
            ${player.name}

          </span>


          <strong>

            ${player.score || 0}点

          </strong>

        </div>

      `
    )
    .join("");


  $("result").innerHTML = `

    <div class="card">

      <div class="muted">
        今回のお題
      </div>


      <div
        style="
          font-size:20px;
          font-weight:700;
          margin:8px 0 20px;
        "
      >

        「${rd.line || ""}」

      </div>


      <div class="muted">
        正解
      </div>


      <div class="big">

        「${rd.expr || ""}」

      </div>


      ${
        answerRows
        ||
        `
          <p class="muted">
            回答はありませんでした。
          </p>
        `
      }

    </div>


    <div class="card">

      <h2>
        🏆 現在の順位
      </h2>

      ${
        ranking
        ||
        `
          <p class="muted">
            参加者がいません。
          </p>
        `
      }

    </div>

  `;

}

/* ==================================================
   次のお題を開始
================================================== */

$("startRound").onclick =
async () => {

  try{

    await init();


    const snapshot =
      await get(
        ref(
          db,
          `rooms/${roomId}`
        )
      );


    const data =
      snapshot.val() || {};


    const players =
      getPlayers(data);


    if(
      players.length < 2
    ){

      alert(
        "2人以上参加してから開始してください。"
      );

      return;

    }


    const currentRoundData =
      data.roundData || {};


    const currentRoundId =
      currentRoundData.id || 0;


    /* ----------------------------------------------
       最初のお題
    ---------------------------------------------- */

    if(!currentRoundId){

      if(
        data.hostUid !== user.uid
      ){

        alert(
          "ゲーム作成者だけが最初のお題を開始できます。"
        );

        return;

      }

    }


    /* ----------------------------------------------
       2ラウンド目以降
    ---------------------------------------------- */

    else{

      /*
        次のお題を開始できるのは
        前ラウンドのAだけ
      */

      if(
        currentRoundData.aUid !== user.uid
      ){

        alert(
          "次のお題を開始できるのは、そのラウンドの表現者だけです。"
        );

        return;

      }


      if(
        !currentRoundData.finished
      ){

        alert(
          "全員の回答が終わってから次のお題を開始してください。"
        );

        return;

      }

    }


    const nextRound =
      (
        currentRoundData.roundNumber || 0
      ) + 1;


    /*
      Aを参加順で決定
    */

    const aIndex =
      (
        nextRound - 1
      ) %
      players.length;


    const aUid =
      players[aIndex][0];


    /*
      セリフ
    */

    const line =
      lines[
        Math.floor(
          Math.random() *
          lines.length
        )
      ];


    /*
      表現
    */

    const expr =
      exprs[
        Math.floor(
          Math.random() *
          exprs.length
        )
      ];


    const roundId =
      Date.now();


    /*
      新しいラウンド

      finished:falseなので、
      前ラウンドのAだった人に
      表示されていた「次のお題を開始」は
      即座に消える。
    */

    await update(
      ref(
        db,
        `rooms/${roomId}`
      ),
      {

        roundData:{

          id:
            roundId,

          roundNumber:
            nextRound,

          aUid:
            aUid,

          line:
            line,

          expr:
            expr,

          performed:
            false,

          performedAt:
            0,

          finished:
            false,

          scoresApplied:
            false

        },

        answers:{}

      }
    );


    /*
      ローカル状態リセット
    */

    performedLocked = false;

    currentAnswerRound = null;

    answerSubmittedRound = null;

    answer = "";

    settlingRoundId = null;


    $("performed")
      .disabled = false;


    $("performed")
      .classList
      .remove("done");


    $("performed")
      .textContent =
      "表現した！";


    $("sendAnswer")
      .disabled = true;


    $("resultCard")
      .classList
      .add("hidden");


    /*
      次のお題開始直後は
      ボタンを明示的に非表示
    */

    $("hostControls")
      .classList
      .add("hidden");


  }catch(error){

    console.error(error);


    alert(
      "お題を開始できませんでした。\n\n" +
      error.message
    );

  }

};

/* ==================================================
   B：回答送信
================================================== */

$("sendAnswer").onclick =
async () => {

  try{

    if(!answer){

      return;

    }


    $("sendAnswer")
      .disabled = true;


    const snapshot =
      await get(
        ref(
          db,
          `rooms/${roomId}`
        )
      );


    const data =
      snapshot.val() || {};


    const rd =
      data.roundData || {};


    /*
      ラウンド終了後は回答不可
    */

    if(
      rd.finished
    ){

      return;

    }


    /*
      すでに回答済み
    */

    const existingAnswer =
      data.answers?.[user.uid];


    if(
      existingAnswer &&
      existingAnswer.roundId === rd.id
    ){

      answerSubmittedRound =
        rd.id;


      stopTimer();


      $("answerCard")
        .classList
        .add("hidden");


      $("roomMessage")
        .textContent =
        "回答を受け付けました。全員の回答を待っています。";

      return;

    }


    /*
      Aは回答不可
    */

    if(
      rd.aUid === user.uid
    ){

      $("sendAnswer")
        .disabled = true;

      return;

    }


    /*
      Aがまだ表現していない
    */

    if(!rd.performed){

      $("sendAnswer")
        .disabled = false;

      return;

    }


    /*
      回答時間
    */

    const elapsed =
      rd.performedAt
        ? (
            Date.now() -
            rd.performedAt
          ) / 1000
        : 999;


    /*
      正解判定
    */

    const correct =
      answer === rd.expr;


    /*
      得点

      ★重要
      ここでは累計scoreを変更しない。
    */

    const points =
      calculateScore(
        correct,
        elapsed
      );


    /*
      回答を保存

      pointsは今回のラウンドで
      獲得する予定の点数として保存する。
    */

    await set(
      ref(
        db,
        `rooms/${roomId}/answers/${user.uid}`
      ),
      {

        roundId:
          rd.id,

        answer:
          answer,

        correct:
          correct,

        elapsed:
          elapsed,

        points:
          points,

        answeredAt:
          Date.now()

      }
    );


    /*
      ★ここでは累計scoreを加算しない。

      全員回答後、
      Aがラウンドを確定するときに
      applyRoundScores()で加算する。
    */


    /*
      回答済み
    */

    answerSubmittedRound =
      rd.id;


    stopTimer();


    $("answerCard")
      .classList
      .add("hidden");


    /*
      ★ここでは結果を表示しない
    */

    $("roomMessage")
      .textContent =
      "回答を受け付けました。全員の回答を待っています。";


    answer = "";


  }catch(error){

    console.error(error);


    $("sendAnswer")
      .disabled = false;


    alert(
      "回答を送信できませんでした。\n\n" +
      error.message
    );

  }

};


/* ==================================================
   初期化
================================================== */

init().catch(
  error => {

    console.error(
      "Firebase初期化エラー:",
      error
    );

  }
);

</script>
