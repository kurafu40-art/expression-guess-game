<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>表現当てゲーム</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  background:#f4f4f5;
  color:#222
}
main{
  max-width:680px;
  margin:auto;
  padding:16px
}
.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin:12px 0;
  box-shadow:0 2px 12px #0001
}
h1,h2{margin:0 0 12px}
.muted{color:#777;font-size:14px}
.big{
  font-size:32px;
  font-weight:800;
  text-align:center;
  line-height:1.4;
  margin:22px 0
}
button,input{font:inherit}
button{
  min-height:46px;
  border:0;
  border-radius:12px;
  padding:10px 15px;
  font-weight:700
}
.primary{
  background:#222;
  color:#fff;
  width:100%
}
.secondary{background:#eee}
.danger{
  background:#f3dddd;
  color:#a00
}
input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px
}
.row{
  display:flex;
  gap:8px
}
.row>*{min-width:0}
.row input{flex:1}
.hidden{display:none!important}
.choice{
  width:100%;
  text-align:left;
  background:#f1f1f1;
  margin:5px 0
}
.choice.selected{
  outline:3px solid #555
}
.list{
  padding:9px 0;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  gap:8px
}
.badge{
  display:inline-block;
  background:#eee;
  border-radius:99px;
  padding:5px 9px;
  font-size:12px
}
.center{text-align:center}
</style>
</head>

<body>
<main>

<div class="card">
  <h1>🎭 表現当てゲーム</h1>
  <p class="muted">
    Aがセリフを指定された表現で演じ、Bが「どんな表現だったか」を当てます。AはGRAVITY内の抽選機等を使用して決定してください。Aがルームを作成します。
  </p>
</div>

<section id="home">

<div class="card">
  <h2>ゲームを作る</h2>
  <input id="hostName" placeholder="あなたの名前">
  <button id="create" class="primary" style="margin-top:10px">
    ルームを作成
  </button>
</div>

<div class="card">
  <h2>ゲームに参加</h2>
  <input id="roomInput" placeholder="4桁の参加コード">
  <input id="joinName" placeholder="名前" style="margin-top:8px">
  <button id="join" class="primary" style="margin-top:10px">
    参加する
  </button>
</div>

<div class="card">
  <button id="editorOpen" class="secondary" style="width:100%">
    セリフ・表現を編集
  </button>
</div>

</section>

<section id="room" class="hidden">

<div class="card center">
  <span class="badge">参加コード</span>
  <div class="big" id="roomCode"></div>
  <p id="players"></p>
</div>

<div class="card" id="hostControls">
  <button id="startRound" class="primary">
    次のお題を開始
  </button>
</div>

<div class="card">
  <h2 id="roleTitle"></h2>
  <div id="roomMessage" class="muted"></div>
</div>

<div class="card hidden" id="promptCard">
  <span class="badge">Aだけ見る</span>
  <div class="big">
    「<span id="line"></span>」を<br>
    「<span id="expr"></span>」で表現！
  </div>
  <button id="performed" class="primary">
    表現した！
  </button>
</div>

<div class="card hidden" id="answerCard">
  <h2>Bの回答</h2>
  <p class="muted">
    Aはどんな表現をしていましたか？
  </p>
  <div id="choices"></div>
  <button id="sendAnswer" class="primary" disabled>
    回答する
  </button>
</div>

<div class="card hidden" id="resultCard">
  <h2>結果</h2>
  <div id="result" class="center"></div>
  <button id="backHome" class="secondary" style="width:100%;margin-top:12px">
    ホームへ
  </button>
</div>

</section>

<section id="editor">

<div class="card">
  <h2>セリフ</h2>

  <div class="row">
    <input id="newLine" placeholder="例：好き">
    <button id="addLine">追加</button>
  </div>

  <div id="lineList"></div>
</div>

<div class="card">
  <h2>表現</h2>

  <div class="row">
    <input id="newExpr" placeholder="例：照れて">
    <button id="addExpr">追加</button>
  </div>

  <div id="exprList"></div>
</div>

<div class="card">
  <button id="editorBack" class="secondary" style="width:100%">
    戻る
  </button>
</div>

</section>

</main>

<script type="module">

/* Firebase設定 */
const firebaseConfig = {
  apiKey: "AIzaSyBL-GvVZv7trLemQ5yqH5DumobwFyx-Yu8",
  authDomain: "expression-guess-game.firebaseapp.com",
  databaseURL: "https://expression-guess-game-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "expression-guess-game",
  storageBucket: "expression-guess-game.firebasestorage.app",
  messagingSenderId: "501092396776",
  appId: "1:501092396776:web:009ae7698b57583956a35d",
  measurementId: "G-HB1VVYDQRD"
};

import {initializeApp}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  update,
  onDisconnect
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* -------------------------
   基本設定
------------------------- */

const $ = id => document.getElementById(id);


/* -------------------------
   デフォルトのセリフ50種類
------------------------- */

const defaultLines = [
  "好き",
  "ありがとう",
  "ごめん",
  "お腹すいた",
  "帰りたい",
  "眠い",
  "助けて",
  "本当？",
  "おはよう",
  "おやすみ",
  "会いたい",
  "どうして？",
  "わからない",
  "任せて",
  "大丈夫",
  "それ欲しい",
  "今どこ？",
  "何してる？",
  "信じて",
  "嘘でしょ？",
  "お腹いっぱい",
  "疲れた",
  "暇だな",
  "行きたい",
  "行きたくない",
  "知らない",
  "知ってる",
  "ほんとに？",
  "やった！",
  "残念",
  "怖い",
  "面白い",
  "つまらない",
  "最高！",
  "最悪だ",
  "どうしよう",
  "ちょっと待って",
  "早くして",
  "ゆっくりして",
  "こっちに来て",
  "あっちに行って",
  "見て！",
  "聞いて！",
  "秘密だよ",
  "お願い",
  "許して",
  "もう一回言って",
  "わかった",
  "無理かも"
];


/* -------------------------
   デフォルトの表現50種類
------------------------- */

const defaultExpr = [
  "照れて",
  "怒って",
  "悲しそうに",
  "嬉しそうに",
  "カッコつけて",
  "恥ずかしそうに",
  "疑って",
  "泣きそうに",
  "驚いて",
  "冷たく",
  "優しく",
  "焦って",
  "困って",
  "得意げに",
  "不安そうに",
  "真剣に",
  "眠そうに",
  "呆れて",
  "甘えるように",
  "大げさに",
  "怖がって",
  "怯えて",
  "楽しそうに",
  "つまらなそうに",
  "嫌そうに",
  "悔しそうに",
  "嫉妬して",
  "心配そうに",
  "自信満々に",
  "自信なさそうに",
  "必死に",
  "笑いをこらえて",
  "笑いながら",
  "泣きながら",
  "怒りをこらえて",
  "驚きを隠して",
  "こっそり",
  "ひそひそ声で",
  "大声で",
  "小声で",
  "真顔で",
  "無表情で",
  "芝居がかった感じで",
  "子供っぽく",
  "偉そうに",
  "お願いするように",
  "必死にお願いするように",
  "冷静に",
  "慌てて",
  "疑い深く"
];


/* -------------------------
   保存データ
------------------------- */

let savedLines =
  JSON.parse(localStorage.getItem("lines") || "null");

let savedExprs =
  JSON.parse(localStorage.getItem("exprs") || "null");


/*
  既に保存されているデータがあっても、
  新しいデフォルト項目を自動追加する
*/

let lines = savedLines
  ? [...savedLines, ...defaultLines.filter(x => !savedLines.includes(x))]
  : [...defaultLines];

let exprs = savedExprs
  ? [...savedExprs, ...defaultExpr.filter(x => !savedExprs.includes(x))]
  : [...defaultExpr];


localStorage.setItem("lines", JSON.stringify(lines));
localStorage.setItem("exprs", JSON.stringify(exprs));


/* -------------------------
   ゲーム変数
------------------------- */

let db;
let user;
let roomId;
let name;
let role;
let answer = "";
let round = 0;
let unsub;


/* -------------------------
   画面切り替え
------------------------- */

function show(id){
  ["home","room","editor"].forEach(x =>
    $(x).classList.add("hidden")
  );

  $(id).classList.remove("hidden");
}


/* -------------------------
   ルームコード
------------------------- */

function code(){
  return Math.floor(
    1000 + Math.random() * 9000
  ).toString();
}


/* -------------------------
   シャッフル
------------------------- */

function shuffle(a){
  return a
    .slice()
    .sort(() => Math.random() - 0.5);
}


/* -------------------------
   編集画面
------------------------- */

function renderEditor(){

  $("lineList").innerHTML =
    lines.map((x,i) => `
      <div class="list">
        <span>${x}</span>
        <button class="danger" onclick="delLine(${i})">
          削除
        </button>
      </div>
    `).join("");

  $("exprList").innerHTML =
    exprs.map((x,i) => `
      <div class="list">
        <span>${x}</span>
        <button class="danger" onclick="delExpr(${i})">
          削除
        </button>
      </div>
    `).join("");
}


window.delLine = i => {

  if(lines.length > 1){

    lines.splice(i,1);

    localStorage.setItem(
      "lines",
      JSON.stringify(lines)
    );

    renderEditor();
  }
};


window.delExpr = i => {

  if(exprs.length > 1){

    exprs.splice(i,1);

    localStorage.setItem(
      "exprs",
      JSON.stringify(exprs)
    );

    renderEditor();
  }
};


$("editorOpen").onclick = () => {
  renderEditor();
  show("editor");
};


$("editorBack").onclick = () => {
  show("home");
};


$("addLine").onclick = () => {

  const v = $("newLine").value.trim();

  if(v){

    lines.push(v);

    localStorage.setItem(
      "lines",
      JSON.stringify(lines)
    );

    $("newLine").value = "";

    renderEditor();
  }
};


$("addExpr").onclick = () => {

  const v = $("newExpr").value.trim();

  if(v){

    exprs.push(v);

    localStorage.setItem(
      "exprs",
      JSON.stringify(exprs)
    );

    $("newExpr").value = "";

    renderEditor();
  }
};


/* -------------------------
   Firebase初期化
------------------------- */

async function init(){

  if(firebaseConfig.apiKey.startsWith("YOUR_")){

    alert(
      "Firebase設定が未入力です。READMEの手順で設定してください。"
    );

    return;
  }

  const app = initializeApp(firebaseConfig);

  db = getDatabase(app);

  const auth = getAuth(app);

  await signInAnonymously(auth);

  user = auth.currentUser;
}


/* -------------------------
   ルームへ入る
------------------------- */

async function enter(id,n,r){

  await init();

  roomId = id;
  name = n;
  role = r;

  const playerRef =
    ref(db,`rooms/${id}/players/${user.uid}`);

  await set(playerRef,{
    name:n,
    role:r,
    online:true
  });

  onDisconnect(playerRef)
    .update({online:false});

  $("roomCode").textContent = id;

  $("roleTitle").textContent =
    r === "A"
      ? "あなたはA（演じる人）"
      : "あなたはB（回答者）";

  if(r !== "A"){
    $("hostControls").classList.add("hidden");
  }

  show("room");

  unsub?.();

  unsub =
    onValue(
      ref(db,`rooms/${id}`),
      snap => sync(snap.val() || {})
    );
}


/* -------------------------
   ゲーム同期
------------------------- */

function sync(data){

  const ps =
    Object.values(data.players || {})
      .filter(p => p.online);

  $("players").textContent =
    "参加者：" +
    ps.map(p => p.name).join("、");


  const rd = data.roundData || {};

  round = rd.id || 0;


  if(!round){

    $("roomMessage").textContent =
      role === "A"
        ? "「次のお題を開始」を押してください。"
        : "Aがお題を開始するのを待っています。";

    return;
  }


  $("roomMessage").textContent =
    rd.performed
      ? (
          role === "A"
            ? "Bが回答するのを待っています。"
            : "Aの表現を見て回答してください。"
        )
      : "Aがお題を確認中です。";


  if(role === "A"){

    $("promptCard")
      .classList
      .remove("hidden");

    $("line").textContent = rd.line;

    $("expr").textContent = rd.expr;
  }


  if(
    role !== "A" &&
    rd.performed &&
    !rd.finished
  ){

    makeChoices(rd.expr);

    $("answerCard")
      .classList
      .remove("hidden");
  }


  if(
    role === "A" &&
    rd.performed &&
    !rd.finished
  ){

    const bCount =
      Object.values(data.players || {})
        .filter(
          p => p.online && p.role === "B"
        ).length;

    const aCount =
      Object.keys(data.answers || {}).length;

    if(
      bCount > 0 &&
      aCount >= bCount
    ){

      update(
        ref(db,`rooms/${roomId}/roundData`),
        {finished:true}
      );
    }
  }


  if(rd.finished){

    $("promptCard")
      .classList
      .add("hidden");

    $("answerCard")
      .classList
      .add("hidden");

    $("resultCard")
      .classList
      .remove("hidden");

    renderResults(data);
  }
}


/* -------------------------
   回答選択肢
   8択
------------------------- */

function makeChoices(correct){

  if($("choices").dataset.round == round){
    return;
  }

  $("choices").dataset.round = round;

  answer = "";

  $("sendAnswer").disabled = true;

  $("choices").innerHTML = "";


  /*
    正解1つ
    ＋
    不正解7つ
    ＝
    合計8択
  */

  const wrongAnswers =
    shuffle(
      exprs.filter(x => x !== correct)
    ).slice(0,7);


  const choices =
    shuffle([
      correct,
      ...wrongAnswers
    ]);


  choices.forEach(x => {

    const b =
      document.createElement("button");

    b.className = "choice";

    b.textContent = x;

    b.onclick = () => {

      document
        .querySelectorAll(".choice")
        .forEach(q =>
          q.classList.remove("selected")
        );

      b.classList.add("selected");

      answer = x;

      $("sendAnswer").disabled = false;
    };

    $("choices").appendChild(b);
  });
}


/* -------------------------
   結果表示
------------------------- */

function renderResults(data){

  const rd = data.roundData || {};

  const arr =
    Object.entries(data.answers || {})
      .map(([id,v]) => {

        const p = data.players?.[id];

        return p
          ? `${p.name}：${v.answer}${
              v.answer === rd.expr
                ? " ✅"
                : " ❌"
            }`
          : "";
      })
      .filter(Boolean);


  $("result").innerHTML = `
    <div class="big">
      正解：${rd.expr}
    </div>

    <p>
      ${arr.join("<br>") || "回答なし"}
    </p>
  `;
}


/* -------------------------
   ルーム作成
------------------------- */

$("create").onclick = async () => {

  try{

    const n =
      $("hostName").value.trim() || "A";

    const id = code();

    await init();

    await set(
      ref(db,`rooms/${id}`),
      {
        created:Date.now(),
        roundData:{
          id:0
        }
      }
    );

    await enter(id,n,"A");

  }catch(error){

    console.error(error);

    alert(
      "ゲームを開始できませんでした。\n" +
      error.message
    );
  }
};


/* -------------------------
   ルーム参加
------------------------- */

$("join").onclick = async () => {

  try{

    const id =
      $("roomInput").value.trim();

    const n =
      $("joinName").value.trim() || "B";


    if(!/^\d{4}$/.test(id)){

      alert(
        "4桁の参加コードを入力してください"
      );

      return;
    }


    await enter(id,n,"B");

  }catch(error){

    console.error(error);

    alert(
      "ゲームに参加できませんでした。\n" +
      error.message
    );
  }
};


/* -------------------------
   次のお題
------------------------- */

$("startRound").onclick = async () => {

  try{

    const line =
      lines[
        Math.floor(
          Math.random() * lines.length
        )
      ];

    const expr =
      exprs[
        Math.floor(
          Math.random() * exprs.length
        )
      ];

    const id = Date.now();


    await update(
      ref(db,`rooms/${roomId}`),
      {
        roundData:{
          id,
          line,
          expr,
          performed:false,
          finished:false
        },
        answers:{}
      }
    );

  }catch(error){

    console.error(error);

    alert(
      "お題を開始できませんでした。\n" +
      error.message
    );
  }
};


/* -------------------------
   A：表現した
------------------------- */

$("performed").onclick = async () => {

  try{

    await update(
      ref(db,`rooms/${roomId}/roundData`),
      {
        performed:true
      }
    );

  }catch(error){

    console.error(error);

    alert(
      "処理に失敗しました。\n" +
      error.message
    );
  }
};


/* -------------------------
   B：回答
------------------------- */

$("sendAnswer").onclick = async () => {

  try{

    await set(
      ref(
        db,
        `rooms/${roomId}/answers/${user.uid}`
      ),
      {
        answer
      }
    );

    $("answerCard")
      .classList
      .add("hidden");

  }catch(error){

    console.error(error);

    alert(
      "回答を送信できませんでした。\n" +
      error.message
    );
  }
};


/* -------------------------
   ホームへ
------------------------- */

$("backHome").onclick = () => {
  location.reload();
};


/* -------------------------
   初期化
------------------------- */

init();

</script>

</body>
</html>
